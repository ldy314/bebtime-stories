"The trunk was full of light. Not lamp-light, not fire-light, but the kind of light that stories make when they're all crammed together — gold and blue and green and the particular amber of a summer evening when someone's just said 'and then — ' and you lean forward because you have to know what happens next.","Clementine reached in. She pulled out a story — it was like pulling a thread from a tapestry, except the thread was made of sound and memory and the smell of someone's kitchen fifty years ago.","She handed it to Tom.","'Take it back to Captain Willits,' she said. 'He'll know what it is.'","Tom held it. It was warm. It hummed, the way a tuning fork hums, except the note was the note of a fourteen-pound catfish and a dock and a man laughing on a July afternoon in 1849.","Tom ran.","He ran all the way to Captain Willits' house, and he pressed the story into the old man's hands, and Captain Willits' eyes went wide and then wet and then he laughed — a big, rolling, catfish-sized laugh — and the story slid back into him like a key into a lock, and he remembered.","Tom ran back to the docks. Clementine was still there, pulling stories out of the trunk, one by one, setting them on the dock like baby birds. They shimmered and hummed and waited.","All night, Tom and Clementine carried stories back to the people of Tibbet's Bend. Mrs. Granger got her ice storm back. The schoolteacher got her blizzard back. The barber got his story about the man who came in for a shave and turned out to be the governor, though that one might have been improved in the telling.","By dawn, the trunk was empty.","Clementine sat on the dock, her feet in the water, looking like a person who'd just given away everything they owned. Which, in a way, she had.","'Aren't you sad?' Tom asked. He felt like he should ask.","Clementine thought about it. Really thought about it, the way only someone who's spent years hoarding things can think about what it means to let them go.","'No,' she said slowly. 'I'm not sad. I'm lighter.' She looked at her hands, as if surprised to find them empty. 'I didn't know how heavy they were. I thought I was keeping them safe, but I think maybe I was just — scared.'","'Scared of what?'","'Scared of being forgotten,' she said. 'If I had all the stories, I thought, then I'd matter. I'd be the one who remembered. But that's not how it works, is it? Stories don't belong to one person. They belong to whoever needs them.'","Tom, who was nine and didn't know much about being scared of being forgotten, nodded anyway. He reckoned she was right.","Clementine stayed on the river. She's probably still there, for all I know, floating the Rattletrap up and down the Old Muddy. But she doesn't steal stories anymore.","Now she trades them.","She'll pull up to a dock and say, 'I'll tell you a story I heard in Hannibal, if you'll tell me one I can carry downstream.' And folks do, because a story shared is a story doubled, and a story hoarded is a story that dies.","The trunk is still on the Rattletrap. It's lighter now. Clementine says it smells like pine trees and old snow and fourteen children and one stove, which doesn't make any sense unless you know the stories, and then it makes all the sense in the world.","And if you ever find yourself on the Old Muddy, on a quiet evening, and you see a flatboat with a girl who has copper hair and too many freckles, you sit down and you tell her a story.","She'll trade you a better one."]},{"id":"2026-07-27-cn","date":"2026年7月27日 · 星期一","dateShort":"07/27","title":"月亮爷爷巡夜（胎教期）","language":"zh","ageGroup":"prenatal","ageLabel":"胎教期","preview":"孩子们，你们知道吗？每天晚上，等你们都睡下了，月亮爷爷就要出来巡夜啦。他提着一盏银灯笼，慢悠悠地走过山岗，走过小河，走过你家的窗台。","moral":"每一份安宁都不是凭空而来的。月亮爷爷的巡夜告诉我们：世界上总有人在你看不到的地方，悄悄地守护着你。就像妈妈怀着你的时候，她的心跳、她的呼吸、她轻声哼的歌，都是为你巡夜的银灯笼。你不必害怕黑暗，因为爱，一直在你身边走着。","content":["孩子们，你们知道吗？每天晚上，等你们都睡下了，月亮爷爷就要出来巡夜啦。他提着一盏银灯笼，慢悠悠地走过山岗，走过小河，走过你家的窗台。他的脚步很轻很轻，轻得连风都听不见。","月亮爷爷先走到山坡上。小草们正歪着脑袋打瞌睡呢，有的还嘟嘟囔囔地说梦话。月亮爷爷把灯笼往低处放了放，银色的光像水一样淌下来，淌过每一片叶子。小草们觉得暖融融的，翻了个身，睡得更香了。","咕咚——咕咚——山脚下的小溪还在流。月亮爷爷蹲下来，对着小溪说：'小溪呀小溪，天黑了，你也该歇歇了。'小溪说：'月亮爷爷，我停不下来呀，我得给下游的小鱼送水去。'月亮爷爷笑了笑，从灯笼里拨出一点光，撒在小溪水面上。溪水一下子亮闪闪的，像铺了一条银被子。小溪流着流着，声音越来越小，越来越小，最后变成细细的、柔柔的'沙沙沙'，像在唱催眠曲。","月亮爷爷又走到老槐树跟前。老槐树已经一百多岁了，胡子（就是那些气根）拖得老长老长。知了在树上睡得正沉，偶尔'吱——'叫半声，又没音了。月亮爷爷轻轻拍了拍老槐树的树干：'老伙计，夜深了。'老槐树的叶子沙沙响了几下，像在说：'嗯，知道了。'然后整棵树安安静静的，一动也不动。","走着走着，月亮爷爷来到一扇窗前。窗里头，有一位妈妈正侧着身子睡，手轻轻搭在肚子上。肚子里有个小宝宝，还没出生呢。月亮爷爷把灯笼贴近窗户，银光透过玻璃，柔柔地洒在妈妈的肚子上。","小宝宝在里头动了动。他感觉到了——那光暖暖的，像妈妈的手掌，像爸爸的声音，像外面的风和溪水混在一起的味道。小宝宝不知道那是什么，但他觉得安全，觉得踏实，又安静地蜷起来。","月亮爷爷站在窗外，看了好一会儿。他没说话，只是把灯笼举得更高一些，让光更均匀地铺满整间屋子。然后他踮起脚，悄悄地走了。","吧嗒，吧嗒。这是月亮爷爷的脚步声吗？不是的，孩子们。月亮爷爷走路是没有声音的。那是什么？那是远处的小青蛙，在池塘边数星星呢——一颗、两颗、三颗……数着数着，自己也打了个哈欠，扑通一声跳进水里，睡了。","月亮爷爷走啊走，走过田野，走过竹林，走过每一户亮着灯的和灭了灯的人家。走到天边的时候，他回头望了一眼——整个世界都安安静静的。小草睡了，小溪睡了，知了睡了，老槐树睡了，妈妈睡了，宝宝也睡了。","月亮爷爷笑了笑，把灯笼别在腰间，自己也坐到云朵上，打了个哈欠。'嗯，今晚的夜，巡完了。'","孩子们，下次你睡不着的时候，就想想月亮爷爷。他提着银灯笼，正从你的窗前经过呢。他不会吵你，只是悄悄地看你一眼，把一点银光留在你的枕头边。然后你就会觉得——嗯，暖暖的，软软的，可以睡了。"]},{"id":"2026-07-27-en","date":"2026年7月27日 · 星期一","dateShort":"07/27","title":"The Robin Who Counted Stars (Prenatal)","language":"en","ageGroup":"prenatal","ageLabel":"Prenatal","preview":"In the old maple tree by the stone wall, Mrs. Robin had a nest. It was a fine nest, round and soft, made of dried grass and mud and the softest bits of moss she could find.","moral":"Even before we arrive, we are already loved. Mrs. Robin counting the stars for her unhatched chicks reminds us that the world prepares a place for us before we even know it exists. Every lullaby sung to an unborn child, every gentle word whispered in the dark, is like a star being counted - a small light saved up, waiting to welcome us home.","content":["In the old maple tree by the stone wall, Mrs. Robin had a nest. It was a fine nest, round and soft, made of dried grass and mud and the softest bits of moss she could find. She had worked on it for three whole days, flying back and forth, back and forth, until her wings ached and her beak was tired.","Now the nest was ready, and in it lay three small eggs, blue as the evening sky. Mrs. Robin sat on them carefully, tucking her warm feathers around them like a blanket. She could feel them beneath her - smooth and cool and full of promise.","Kuplink. Kuplank. Kuplunk. That was the sound of a berry dropping into a tin pail somewhere down the hill. Mrs. Robin cocked her head. That would be old Mr. McCracken, picking blueberries in the twilight, the way he did every summer evening. She had watched him from this very tree last summer, when she was just a fledgling herself.","The sun went down behind the ridge, and the sky turned from gold to rose to deep, deep blue. One by one, the stars came out - first one, then three, then seven, then too many to count.","But Mrs. Robin tried anyway.","'One,' she said softly, looking at the brightest one. 'Two.' She found another, just above the steeple of the white church. 'Three.' There was one peeking through the branches of the pine tree. 'Four, five, six...' She counted slowly, in a whisper, the way you count sheep when you cannot sleep.","Her eggs did not move. They did not cheep or wiggle. But Mrs. Robin counted the stars for them anyway, the way a mother hums a lullaby to a child who has not yet learned to listen.","Down below, the creek murmured its nighttime song - shush, shush, shush - like a brook clearing its throat before bedtime. A bullfrog in the mill pond said 'br-r-rump' once, then thought better of it and closed his mouth. The fireflies came out, drifting among the cattails like tiny lanterns, like the stars had come down to visit the ground.","Mrs. Robin counted the fireflies too. 'Seven, eight, nine...' But they kept moving, and she lost track. She ruffled her feathers in a small huff. 'Well,' she said to her eggs, 'I suppose stars are easier. They stay where you put them.'","A breeze came up from the south, warm and smelling of hay and clover. It rustled through the maple leaves above her head - shhh, shhh, shhh - as if the tree itself were saying 'hush.' Mrs. Robin settled deeper into her nest. The eggs were warm. The night was kind. The stars were out.","She counted three more stars - 'ten, eleven, twelve' - and then her eyes grew heavy. The numbers started to blur together. Twelve became twenty. Twenty became a hundred. A hundred became just... light. Soft, silver light, falling through the leaves like rain.","'Thirteen,' she murmured, her beak barely moving. 'Four... teen...'","And then Mrs. Robin was asleep, and the stars kept watch for her.","In the morning, the sun would come up and dry the dew on the grass, and Mr. McCracken would come out with his pail, kuplink, kuplank, kuplunk, and the world would be busy and bright again. But for now, in the old maple tree by the stone wall, three small blue eggs waited in their warm nest, and their mother counted stars for them in her dreams.","And the stars, patient and old, did not mind being counted. They had been waiting a very long time to be noticed by someone small and new. They could wait a little longer."]},{"id":"2026-07-28-en","date":"2026年7月27日 · 星期一","dateShort":"07/27","title":"The Moon's Lullaby (Prenatal)","language":"en","ageGroup":"prenatal","ageLabel":"Prenatal","preview":"Close your tiny eyes, little one, and listen to the soft hum of the moon. The moon sings a gentle song just for you, a song that rocks the whole world to sleep.","moral":"You are always safe and loved, wrapped in the gentle rhythm of the world.","content":["Close your tiny eyes, little one, and listen to the soft hum of the moon. The moon sings a gentle song just for you, a song that rocks the whole world to sleep.","Shh... shh... the moon drifts slowly across the sky, like a feather floating on a pond. It peeks through the clouds, casting a silver glow on the earth below.","Down in the meadow, a mother rabbit tucks her bunnies into a nest of soft grass. 'Hush now,' she whispers, 'the moon is here to watch over you.' And the bunnies close their eyes, feeling the moon's warm light.","By the pond, a mama duck settles her ducklings under her wing. 'Listen,' she says, 'the moon is humming a lullaby.' The ducklings hear the gentle swoosh of the water and the soft peep of sleepy frogs.","High in the mountains, a wolf mother curls around her pups. She sings a low, quiet song that matches the moon's rhythm. The pups nuzzle close, their breath slow and even, like the rising and falling of a gentle wave.","And far away, in a cozy room, a mama's voice joins the moon's song. She hums a tune that you can feel in your heart—a steady, loving beat. 'I am here,' she says softly, 'and the moon is here, and you are safe.'","The moon yawns, and stars twinkle one by one. The whole world is quiet now, wrapped in a blanket of night. Sleep, little one, sleep. The moon's lullaby will keep you until morning."]},{"id":"2026-07-28-zh","date":"2026年7月27日 · 星期一","dateShort":"07/27","title":"【胎教期】月亮妈妈的摇篮曲","language":"zh","ageGroup":"prenatal","ageLabel":"胎教期","preview":"小星星们在天上眨着眼睛，月亮妈妈轻轻哼着歌，她的歌声像羽毛一样，软软的，暖暖的。","moral":"妈妈的等待是世界上最温暖的爱，就像月亮妈妈守护着每一颗小星星。","content":["小星星们在天上眨着眼睛，月亮妈妈轻轻哼着歌，她的歌声像羽毛一样，软软的，暖暖的。","月亮妈妈说：'听，风宝宝来了。'呼——呼——风宝宝绕着星星们打转，发出'呜呜'的声音，像在吹一支小小的口琴。","云朵姐姐也来了，她穿着一件白白的棉袄，慢慢地飘过来。月亮妈妈说：'云朵姐姐要给你们盖被子呢。'云朵姐姐轻轻地、轻轻地，把棉被盖在小星星身上。","小星星们闭上了眼睛，可有一颗最小的小星星，还在偷偷地眨着眼。月亮妈妈温柔地说：'怎么还不睡呀？'小星星小声说：'我在等妈妈来。'","月亮妈妈笑了，她的笑容像弯弯的银钩，挂在夜空。她说：'妈妈永远在这里，看着你，守护你。'","小星星终于安心了，他打了个哈欠，'哈——'，然后闭上眼睛，听着月亮妈妈轻柔的歌声，慢慢睡着了。","月亮妈妈的歌声越来越轻，越来越慢，像远处小河的水声，叮咚叮咚，流进梦里。"]},{"id":"2026-07-28-zh","date":"2026年7月27日 · 星期一","dateShort":"07/27","title":"【胎教期】月亮妈妈的小星星","language":"zh","ageGroup":"prenatal","ageLabel":"胎教期","preview":"在天空的深处，住着月亮妈妈和一颗小小的星星。小星星总是问：「妈妈，我什么时候才能像太阳一样亮呢？」","moral":"每个宝宝都有自己成长的节奏，在妈妈的爱里耐心等待，就会绽放属于自己的光芒。","content":["在天空的深处，住着月亮妈妈和一颗小小的星星。小星星总是问：「妈妈，我什么时候才能像太阳一样亮呢？」","月亮妈妈轻轻搂住她，声音像柔柔的风：「宝宝，你听——滴答、滴答，那是时间小精灵走路的声音。他们走啊走，会带你来你的光。」","小星星眨眨眼，看见远处的云朵里，有萤火虫提着小灯笼飞过，一闪一闪，像在说悄悄话。","「妈妈，萤火虫好亮呀，我也想像他们那样。」小星星说。","月亮妈妈笑了：「可是呀，每颗星星的光都不一样。你瞧，那颗最亮的星星，他小时候也像你一样，慢慢地、慢慢地，才学会发光呢。」","小星星安静下来，依偎在妈妈怀里。她听见妈妈的心跳声——咚、咚、咚，像摇篮曲一样安稳。","远处传来风铃的声音，叮叮当当，好像也在说：「别急，别急，你慢慢长大。」","小星星闭上眼睛，在妈妈温柔的歌声里，睡着了。梦里，她的光一点一点亮起来，像一朵花慢慢开放。","月亮妈妈轻轻摇着她，对全世界说：「嘘，我的小星星正在长大呢。」"]},{"id":"2026-07-28-zh","date":"2026年7月27日 · 星期一","dateShort":"07/27","title":"【胎教期】月亮妈妈等宝宝","language":"zh","ageGroup":"prenatal","ageLabel":"胎教期","preview":"天上有一轮圆圆的月亮，她肚子里有个月亮宝宝。月亮妈妈轻轻拍着肚子，对宝宝说：'宝宝呀，妈妈等你长大，等你出来看世界。'","moral":"等待是因为爱。在妈妈肚子里，宝宝被爱和守护包围，安心地慢慢长大。","content":["天上有一轮圆圆的月亮，她肚子里有个月亮宝宝。月亮妈妈轻轻拍着肚子，对宝宝说：'宝宝呀，妈妈等你长大，等你出来看世界。'","月亮宝宝在妈妈肚子里，咕咚咕咚地翻了个身，好像听到了妈妈的声音。妈妈笑了，声音像风铃一样叮叮当当：'宝宝，你听到妈妈在叫你吗？妈妈在这里，一直在这里。'","每天晚上，月亮妈妈都慢慢地在天空散步，一边走一边哼着歌。哼——哼——哼——那歌声软软的，像棉花糖一样甜。星星们听见了，也一闪一闪地跟着唱。","有一天，月亮妈妈停在一朵云旁边，轻轻说：'云朵姐姐，我宝宝什么时候才能出来呀？'云朵姐姐温柔地飘过来，蹭蹭月亮妈妈的脸：'别着急，等宝宝准备好的时候，他就会出来了。你呀，只要每天跟他说说话，他就知道你在等他。'","于是月亮妈妈每天都跟宝宝说话。'宝宝，你听，那是风的声音，沙沙沙，像妈妈在抚摸你。宝宝，你闻，那是花的香味，香香的，甜甜的。宝宝，你看，那是星星的眼睛，眨呀眨，像在对你说晚安。'","月亮宝宝在妈妈肚子里，听得可认真了。他觉得自己好像已经见过风、闻过花、看过星星。他好想快点出来，抱抱妈妈。可是妈妈总说：'不急不急，慢慢长，妈妈等你。'","终于有一天，月亮宝宝觉得自己长大了。他轻轻推了推妈妈的手，说：'妈妈，我准备好了。'月亮妈妈开心地笑了，那一刻，天空变得特别亮，特别温柔。","月亮宝宝出生了，他躺在妈妈的怀里，看着满天星光。妈妈低下头，亲亲他的额头：'宝宝，妈妈等了你很久很久，你知道吗？'宝宝咿咿呀呀地回应，好像在说：'妈妈，我也在等你呀。'","从此，月亮妈妈和月亮宝宝每天一起在天空散步。妈妈还是哼着那首歌，宝宝也学着哼。星星们还是跟着唱，风儿也轻轻吹。一切都那么美，因为爱，因为等待，因为守护。"]},{"id":"2026-07-29-en","date":"2026年7月28日 · 星期二","dateShort":"07/28","title":"The Moonlight Lullaby (Prenatal)","language":"en","ageGroup":"prenatal","ageLabel":"Prenatal","preview":"Close your eyes, little one, and listen to the gentle hum of the moon. Mama's voice is a soft river, flowing all around you.","moral":"You are always wrapped in love, even before you are born.","content":["Hush now, little seed, snug in your warm, dark sea. Can you hear it? Shhh… the moon is singing a lullaby just for you. A soft, silver melody that drifts through the water like a feather. La-la-loo, la-la-lee, the moon hums to you and me.","Mama's heart beats a steady drum: boom-boom, boom-boom, boom-boom. And your tiny heart answers: pitter-pat, pitter-pat, pitter-pat. Together they dance a sleepy song, rocking you in your cozy boat. The water swirls gently, whoosh, whoosh, whoosh, as if the whole world is saying, Rest, little one, rest.","Outside, the stars twinkle like fireflies, each one a tiny friend winking down at you. The wind whispers through the trees: hoo-hoo, hoo-hoo, a soft owl calls. But you don't need to see—you can feel it all. Mama's warmth wraps around you like a blanket, and her voice hums on and on, a river of love that never stops.","So drift, little one, on the tide of the night. The moon will watch over you, the stars will keep guard, and Mama's voice will carry you to dreamland. Goodnight, sweet pea. Sleep tight, little bean. You are safe, you are loved, you are never alone."]},{"id":"2026-07-29-zh","date":"2026年7月28日 · 星期二","dateShort":"07/28","title":"「胎教期」月亮妈妈的摇篮曲","language":"zh","ageGroup":"prenatal","ageLabel":"胎教期","preview":"小星星在天空的摇篮里，听着月亮妈妈哼唱摇篮曲。月亮妈妈的声音像丝绸一样柔软，轻轻包裹着每一颗星星。","moral":"每一个生命都在爱和等待中诞生，妈妈的声音是最温暖的守护。","content":["小星星呀，你知道月亮妈妈是怎么唱歌的吗？啊，那声音就像春天的风，轻轻地、软软地吹过你的脸颊。月亮妈妈每天晚上都坐在天空的最中央，把金色的光芒洒下来，像一条暖暖的毯子，盖在所有的星星宝宝身上。","有一颗特别小的小星星，她叫闪闪。闪闪好小好小，躲在云朵摇椅里，眨巴着亮晶晶的眼睛。她问月亮妈妈：『妈妈妈妈，我什么时候才能长大呀？』月亮妈妈温柔地说：『不要着急呀，宝贝。你听，风在轻轻地吹，雨在滴答滴答地唱，你慢慢等，慢慢长。』","闪闪不说话了，她竖起小耳朵听。远处传来咕咚咕咚的声音，那是小河在翻跟头呢。又听见沙沙沙的声音，那是树叶在说悄悄话。还有一个很轻很轻的声音，像棉花糖一样软，在说：『我爱你，小星星……』闪闪问：『妈妈，这是谁在说话呀？』","月亮妈妈笑了，说：『那是地球上的妈妈在对你说话呀。每一个小星星都有一位地球妈妈，她们每天晚上都在心里念着你的名字，等着你出生呢。』闪闪觉得心里暖暖的，好像被两只温柔的手抱着。","月亮妈妈开始唱摇篮曲了：『睡吧，睡吧，我的小宝贝，星星在眨眼，月亮在跟随……』闪闪听着听着，眼皮变得好重好重，就像两片花瓣慢慢合起来。她打了个小小的哈欠，呼噜呼噜地睡着了。","梦里啊，闪闪看见一朵花苞，它紧紧地抱着自己，在泥土里等待着春天。蝴蝶轻轻飞过，说：『慢慢等呀，等你打开花瓣的时候，就是最美的日子。』闪闪笑了，她知道自己也在等待，等待一个温暖的拥抱，等待妈妈的声音在耳边说：『宝贝，欢迎你。』"]}];

  stories = EMBEDDED_STORIES;
  renderStoryList();
  
  // 再尝试从 stories.json 加载最新数据（如果成功则更新）
  try {
    const url = 'stories.json?t=' + Date.now();
    const resp = await fetch(url);
    if (resp.ok) {
      const freshData = await resp.json();
      if (freshData && freshData.length > 0) {
        stories = freshData;
        renderStoryList();
      }
    }
  } catch (e) {
    // fetch 失败也没关系，内嵌数据已经渲染了
    console.log('Using embedded data (fetch failed):', e.message);
  }
}

// ===== Security: HTML Escape (prevents XSS) =====
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ===== Render Story List =====
function renderStoryList() {
  const list = document.getElementById('storyList');
  const empty = document.getElementById('emptyState');

  let filtered = stories.slice().reverse();

  // 年龄筛选
  if (currentAgeFilter !== 'all') {
    filtered = filtered.filter(s => s.ageGroup === currentAgeFilter);
  }

  // 语言筛选
  if (currentLangFilter !== 'all') {
    filtered = filtered.filter(s => (s.language || 'zh') === currentLangFilter);
  }

  // 搜索
  if (searchKeyword) {
    const kw = searchKeyword.toLowerCase();
    filtered = filtered.filter(s =>
      s.title.toLowerCase().includes(kw) ||
      s.preview.toLowerCase().includes(kw) ||
      s.moral.toLowerCase().includes(kw)
    );
  }

  if (filtered.length === 0) {
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';

  list.innerHTML = filtered.map(s => {
    const lang = s.language || 'zh';
    const langLabel = lang === 'zh' ? '中文' : 'EN';
    const langIcon = lang === 'zh' ? '🇨🇳' : '🇬🇧';
    return `
    <div class="story-card fade-in" onclick="openStory('${escapeHtml(s.id)}')">
      <div class="story-card-header">
        <div class="story-card-title">${escapeHtml(s.title)}</div>
        <div class="story-card-date">${escapeHtml(s.dateShort)}</div>
      </div>
      <div class="story-card-preview">${escapeHtml(s.preview)}</div>
      <div class="story-card-footer">
        <span class="age-tag">🍼 ${escapeHtml(s.ageLabel)}</span>
        <span class="lang-tag ${lang}">${langIcon} ${escapeHtml(langLabel)}</span>
        <span class="moral-tag">✨ ${escapeHtml(s.moral.substring(0, 30))}...</span>
      </div>
    </div>
    `;
  }).join('');
}

// ===== Open Story =====
function openStory(id) {
  const s = stories.find(x => x.id === id);
  if (!s) return;

  const lang = s.language || 'zh';
  const langLabel = lang === 'zh' ? '中文' : 'English';
  const langIcon = lang === 'zh' ? '🇨🇳' : '🇬🇧';
  const moralTitle = lang === 'zh' ? '✨ 故事小语' : '✨ Story Lesson';
  const footerText = lang === 'zh' ? '晚安，好梦' : 'Good night, sweet dreams';

  const page = document.getElementById('readingPage');
  const content = document.getElementById('readingContent');
  const titleBar = document.getElementById('readingTitleBar');

  titleBar.textContent = s.title;

  content.innerHTML = `
    <div class="reading-date">${escapeHtml(s.date)}</div>
    <h1 class="reading-title">🌛 ${escapeHtml(s.title)}</h1>
    <div class="reading-badges">
      <span class="age-tag">🍼 ${escapeHtml(s.ageLabel)}</span>
      <span class="lang-tag ${lang}">${langIcon} ${escapeHtml(langLabel)}</span>
    </div>
    <div class="reading-divider">— ✿ —</div>
    <div class="reading-body lang-${lang}">
      ${s.content.map(p => `<p>${escapeHtml(p)}</p>`).join('')}
    </div>
    <div class="reading-moral">
      <div class="reading-moral-title">${escapeHtml(moralTitle)}</div>
      <div class="reading-moral-text">${escapeHtml(s.moral)}</div>
    </div>
    <div class="reading-footer">
      <span>🌙</span> ${escapeHtml(footerText)} <span>🌙</span>
    </div>
  `;

  page.classList.add('active');
  page.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}

// ===== Close Story =====
function closeStory() {
  const page = document.getElementById('readingPage');
  page.classList.remove('active');
  document.body.style.overflow = '';
}

// ===== Event Listeners =====
document.getElementById('backBtn').addEventListener('click', closeStory);

// 年龄筛选
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentAgeFilter = tab.dataset.age;
    renderStoryList();
  });
});

// 语言筛选
document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentLangFilter = btn.dataset.lang;
    renderStoryList();
  });
});

// 搜索
document.getElementById('searchInput').addEventListener('input', (e) => {
  searchKeyword = e.target.value.trim();
  renderStoryList();
});

// ===== Init =====
loadStories();

// ===== 下拉刷新（手机端） =====
let touchStartY = 0;
let isRefreshing = false;
document.addEventListener('touchstart', (e) => {
  touchStartY = e.touches[0].clientY;
});
document.addEventListener('touchmove', (e) => {
  const scrollY = window.scrollY;
  const currentY = e.touches[0].clientY;
  if (scrollY === 0 && currentY - touchStartY > 80 && !isRefreshing) {
    isRefreshing = true;
    loadStories().finally(() => {
      setTimeout(() => { isRefreshing = false; }, 1000);
    });
  }
});
</script>
