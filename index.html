<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>🌛 睡前故事 · 每日一个温柔的好梦</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #faf6f0;
  --card: #fffdf8;
  --primary: #f0b850;
  --primary-light: #fef3d6;
  --text: #5a4535;
  --text-light: #9b8b7a;
  --text-lighter: #c4b49a;
  --border: #f0e6d6;
  --shadow: 0 2px 12px rgba(180,160,130,0.12);
  --shadow-hover: 0 4px 20px rgba(180,160,130,0.2);
  --radius: 16px;
  --lang-zh: #e8a040;
  --lang-en: #6080a8;
}

html { font-size: 16px; }

body {
  background: var(--bg);
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Serif SC", serif;
  color: var(--text);
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  padding-bottom: 80px;
}

/* ===== Header ===== */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(250,246,240,0.95);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
}

.header-inner {
  max-width: 680px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.logo {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
}
.logo span { margin-right: 4px; }

.search-box {
  flex: 1;
  max-width: 180px;
  position: relative;
}
.search-box input {
  width: 100%;
  padding: 8px 12px 8px 36px;
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 14px;
  background: var(--card);
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.search-box input:focus { border-color: var(--primary); }
.search-box .icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  opacity: 0.4;
}

/* ===== Language Switch ===== */
.lang-switch {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
}
.lang-btn {
  padding: 6px 12px;
  border-radius: 16px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text-light);
  cursor: pointer;
  transition: all 0.2s;
}
.lang-btn.active {
  color: #fff;
  border-color: transparent;
}
.lang-btn.active[data-lang="zh"] { background: var(--lang-zh); }
.lang-btn.active[data-lang="en"] { background: var(--lang-en); }
.lang-btn.active[data-lang="all"] { background: var(--primary); }

/* ===== Tabs ===== */
.tabs {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }

.tab {
  flex-shrink: 0;
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  background: var(--card);
  color: var(--text-light);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.2s;
}
.tab.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

/* ===== Main ===== */
.main {
  max-width: 680px;
  margin: 0 auto;
  padding: 0 16px;
}

/* ===== Story Card ===== */
.story-card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 16px;
  overflow: hidden;
  cursor: pointer;
  transition: box-shadow 0.2s, transform 0.1s;
}
.story-card:active {
  transform: scale(0.99);
}
.story-card:hover {
  box-shadow: var(--shadow-hover);
}

.story-card-header {
  padding: 20px 20px 12px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.story-card-title {
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.4;
  flex: 1;
}

.story-card-date {
  font-size: 12px;
  color: var(--text-lighter);
  white-space: nowrap;
  margin-top: 2px;
}

.story-card-preview {
  padding: 0 20px 16px;
  font-size: 14px;
  color: var(--text-light);
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.story-card-footer {
  padding: 0 20px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.age-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 500;
  background: var(--primary-light);
  color: #c8923a;
}

.lang-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 500;
}
.lang-tag.zh { background: #fef0e0; color: #d4881a; }
.lang-tag.en { background: #e0eaf5; color: #5070a0; }

.moral-tag {
  font-size: 12px;
  color: var(--text-lighter);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ===== Reading Page ===== */
.reading-page {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg);
  z-index: 200;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.reading-page.active { display: block; }

.reading-header {
  position: sticky;
  top: 0;
  background: rgba(250,246,240,0.95);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 10;
}

.back-btn {
  font-size: 20px;
  color: var(--text);
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 8px;
  transition: background 0.2s;
}
.back-btn:active { background: var(--primary-light); }

.reading-title-bar {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.reading-content {
  max-width: 680px;
  margin: 0 auto;
  padding: 24px 20px 48px;
}

.reading-date {
  font-size: 13px;
  color: var(--text-lighter);
  text-align: center;
  margin-bottom: 8px;
  letter-spacing: 1px;
}

.reading-title {
  text-align: center;
  font-size: 24px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
}

.reading-badges {
  text-align: center;
  margin-bottom: 24px;
  display: flex;
  justify-content: center;
  gap: 8px;
}
.reading-badges .age-tag,
.reading-badges .lang-tag {
  font-size: 12px;
  padding: 4px 14px;
  border-radius: 14px;
}

.reading-divider {
  text-align: center;
  color: var(--text-lighter);
  font-size: 14px;
  margin-bottom: 28px;
}

.reading-body {
  font-size: 17px;
  line-height: 2;
  color: var(--text);
  text-align: justify;
}
.reading-body p {
  margin-bottom: 16px;
  text-indent: 2em;
}
/* 英文故事不需要首行缩进 */
.reading-body.lang-en p {
  text-indent: 0;
}
.reading-body.lang-en {
  font-family: Georgia, "Times New Roman", serif;
}

.reading-moral {
  margin-top: 36px;
  padding: 20px 24px;
  background: var(--primary-light);
  border-radius: 16px;
  border-left: 4px solid var(--primary);
}
.reading-moral-title {
  font-size: 14px;
  color: #c8923a;
  font-weight: 600;
  margin-bottom: 8px;
}
.reading-moral-text {
  font-size: 15px;
  line-height: 1.8;
  color: #7a6550;
}

.reading-footer {
  text-align: center;
  margin-top: 32px;
  font-size: 13px;
  color: var(--text-lighter);
}

/* ===== Empty State ===== */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-lighter);
}
.empty-state .emoji {
  font-size: 48px;
  margin-bottom: 16px;
}
.empty-state p {
  font-size: 15px;
}

/* ===== Loading ===== */
.loading {
  text-align: center;
  padding: 40px;
  color: var(--text-lighter);
  font-size: 14px;
}

/* ===== Responsive ===== */
@media (max-width: 380px) {
  html { font-size: 15px; }
  .reading-body { font-size: 16px; }
  .lang-btn { padding: 5px 10px; font-size: 11px; }
}

/* ===== Animation ===== */
.fade-in {
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<!-- ===== Header ===== -->
<div class="header">
  <div class="header-inner">
    <div class="logo"><span>🌛</span>睡前故事</div>
    <div class="search-box">
      <span class="icon">🔍</span>
      <input type="text" id="searchInput" placeholder="搜索故事...">
    </div>
    <div class="lang-switch">
      <button class="lang-btn active" data-lang="all">全部</button>
      <button class="lang-btn" data-lang="zh">中文</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
  </div>
</div>

<!-- ===== Tabs ===== -->
<div class="tabs" id="tabs">
  <div class="tab active" data-age="all">全部年龄</div>
  <div class="tab" data-age="prenatal">胎教期</div>
  <div class="tab" data-age="0-1">0-1岁</div>
  <div class="tab" data-age="1-3">1-3岁</div>
  <div class="tab" data-age="3-6">3-6岁</div>
  <div class="tab" data-age="6+">6岁以上</div>
</div>

<!-- ===== Main List ===== -->
<div class="main">
  <div id="storyList"></div>
  <div id="emptyState" class="empty-state" style="display:none;">
    <div class="emoji">🌙</div>
    <p>还没有故事哦，明天再来看看吧</p>
  </div>
</div>

<!-- ===== Reading Page ===== -->
<div class="reading-page" id="readingPage">
  <div class="reading-header">
    <div class="back-btn" id="backBtn">←</div>
    <div class="reading-title-bar" id="readingTitleBar">睡前故事</div>
  </div>
  <div class="reading-content" id="readingContent"></div>
</div>

<script>
const EMBEDDED_STORIES = [{"id":"2026-07-16-cn","date":"2026年7月16日 · 星期四","dateShort":"07/16","title":"小星星的暖暖","language":"zh","ageGroup":"prenatal","ageLabel":"胎教期","preview":"在一个很远很远的地方，有一片安静的山谷。山谷里有一条浅浅的小溪，溪水叮叮咚咚，像在唱一首永远唱不完的歌...","moral":"被爱是一种温暖，爱别人是一种力量。这世界上的每一份在乎，都是一束看不见却永远不会熄灭的光。愿你被爱包围，也愿你成为别人的光。","content":["在一个很远很远的地方，有一片安静的山谷。山谷里有一条浅浅的小溪，溪水叮叮咚咚，像在唱一首永远唱不完的歌。","小溪边住着一只小兔子，名字叫棉棉。棉棉有一身像云朵一样柔软的白毛，和一双总是亮晶晶的大眼睛。","每天晚上，棉棉都会坐在溪边的大石头上，看着天上一颗一颗亮起来的星星。她最喜欢的是最亮的那一颗——那颗星星叫「暖暖」。","「暖暖，暖暖，」棉棉轻轻地说，「你离我那么远，会不会孤单呀？」","这天晚上，棉棉刚说完，就看见溪水里映着的星星忽然闪了一下。然后，一个小小的光点从水面上飘了起来，亮闪闪的，像一颗迷你的小太阳。","「你好呀，棉棉。」光点发出温柔的声音。","「你……你是暖暖吗？」棉棉惊讶地问。","「是呀。我听见你每天晚上都在跟我说话。」暖暖的光一闪一闪的，「我一点也不孤单，因为我知道你在看着我。被人在乎的感觉，就是最温暖的陪伴呀。」","棉棉开心极了，她和暖暖聊了很多很多：聊山谷里的花什么时候开，聊小溪里的小鱼爱玩什么游戏，聊风吹过树林时树叶会唱什么歌。","暖暖说：「棉棉，你知道吗？世界上有一种光，比星星更亮。」","「是什么光？」棉棉好奇地竖起耳朵。","「是爱呀。」暖暖轻轻地说，「当一个生命被另一个生命深深地爱着的时候，那种光比所有的星星加起来还要亮。你看不见它，但它一直都在。就像你每天来看我，就像风每天拥抱山谷，就像小溪永远陪着石头。」","棉棉听得入了神。她想起妈妈每天给她准备的胡萝卜，想起爸爸驮着她跳过小溪去看花，想起朋友们在草地上一起打滚儿的下午。","「原来我一直被这么多光包围着呀。」棉棉的心里暖暖的。","「是呀，」暖暖说，「而且将来，还会有更多更多的光来到你身边。也许是一个新朋友，也许是一个你想保护的人，也许是一个小小的、软软的、需要你牵着的手。」","棉棉的眼睛更亮了：「我会好好爱每一个来到我身边的人。」","暖暖慢慢地飘起来，越飘越高，回到了天上的星星群里。不过这一次，棉棉觉得天上的每一颗星星，都在对她眨眼睛，都变成了「暖暖」。","山谷里安安静静的。小溪还在叮叮咚咚地唱歌。棉棉趴在石头上，慢慢地闭上了眼睛，嘴角挂着甜甜的笑。","她知道，明天天亮的时候，山谷还在，小溪还在，爱她的和她爱的人，都在。","而那些看不见的光，也会一直在——在每一阵风里，在每一片叶子里，在每一个温柔的晚安里。","晚安，棉棉。","晚安，每一个被爱包围的小生命。"]},{"id":"2026-07-17-cn","date":"2026年7月17日 · 星期五","dateShort":"07/17","title":"小种子的春天","language":"zh","ageGroup":"prenatal","ageLabel":"胎教期","preview":"在春天刚刚到来的时候，一颗小小的种子落在了柔软湿润的泥土里。她圆圆滚滚的，裹着一层浅褐色的外衣，安安静静地睡着了...","moral":"世界上最深的爱，是在你还没有到来之前，就已经开始了。有一个人在等你，用尽了所有的温柔与耐心。愿你带着这份爱，勇敢地来到这个世界——因为你，本身就是最美的花开。","content":["在春天刚刚到来的时候，一颗小小的种子落在了柔软湿润的泥土里。她圆圆滚滚的，裹着一层浅褐色的外衣，安安静静地睡着了。","泥土里很黑，也很安静。可是小种子一点也不害怕，因为她能感觉到，头顶上有一片暖暖的东西，像一床看不见的被子，轻轻地盖着她。后来她才知道，那叫做「阳光」。","有一天，小种子在梦里听见了一个声音。那声音软软的、甜甜的，像是滴在花瓣上的露水。","「你好呀，小宝贝。」那个声音轻轻地说。","小种子动了动，她想回答，却发现自己还不会说话。她只能轻轻地晃了晃自己的壳。","那个声音又来了，每天都会来。有时候是早晨，声音里带着鸟鸣一样的清脆；有时候是傍晚，声音里带着晚风一样的温柔。声音的主人会给她唱歌，会给她讲泥土外面的世界——讲蓝得像宝石一样的天空，讲白得像棉花糖一样的云朵，讲那些飞来飞去、唱着歌的小鸟。","「等你出来了，我带你看最好看的花，喝最甜的露水，在草地上打一个下午的滚儿。」声音这样对她说。","小种子虽然听不懂全部，但她觉得心里暖洋洋的。她开始用力地吸收土壤里的养分，让自己的身体一天比一天饱满。她想快一点长大，她想看看那个每天对她说话的人，是什么样子的。","春雨来了，细细密密的雨丝渗进泥土里，像无数双温柔的手，轻轻托着她。春风也来了，在泥土外面呼呼地吹着，像在喊：「加油呀，加油呀，我们在外面等你！」","小种子越来越有力气了。她伸了伸身体，发现自己长出了一条白白嫩嫩的小尾巴——那是她的根，正牢牢地抓住脚下的泥土。她又往上挺了挺，头顶上冒出了一点嫩绿色的小芽。","「我快要看见你了。」小种子在心里默默地说。","终于有一天，小种子——不，现在她已经是一棵小苗了——用尽了全身的力气，向上一顶。","「啵。」","她破土而出了。","第一缕阳光轻轻地落在她的两片小叶子上。暖洋洋的。她眨了眨眼睛——如果叶子也能眨眼睛的话——看见了这个世界。","世界好大，好亮，好美。天空果然像蓝宝石，云朵果然像棉花糖，远处果然有小鸟在唱歌。","然后，她看到了那个每天对她说话的人。","那是一位年轻的妈妈。她蹲在小苗面前，眼里满是亮晶晶的东西——后来小苗知道，那叫「眼泪」，是开心的眼泪。妈妈的嘴角弯成了月牙，她的手轻轻地、小心翼翼地碰了碰小苗的叶子，像碰一颗世界上最珍贵的宝石。","「你终于来了。」妈妈轻轻地说，「我等你，等了整整一个春天。」","小苗迎着风摇了摇叶子。她想说好多好多话，可是她还是一棵小苗，还不会说话。","不过没关系。在未来的日子里，她有的是时间。她会开出最美的花给妈妈看，会在风里跳舞给妈妈看，会用每一片叶子、每一朵花瓣，告诉妈妈——","「谢谢你，在我还只是泥土里一颗小小的种子的时候，就已经那么那么地爱我。」"]},{"id":"2026-07-18-cn","date":"2026年7月18日 · 星期六","dateShort":"07/18","title":"小星星的礼物","language":"zh","ageGroup":"prenatal","ageLabel":"胎教期","preview":"在蓝蓝的天空尽头，住着一颗小小的星星。她没有别的星星那么大，也没有别的星星那么亮，但她有一颗特别温柔的心...","moral":"你还没来到这个世界的时候，就已经有人在默默地爱你、守护你了。你本身就是一份珍贵无比的礼物，带着满满的星光与期待。愿你带着这份温柔的爱，安心地成长——世界在等你，星星也在等你。","content":["在蓝蓝的天空尽头，住着一颗小小的星星。她没有别的星星那么大，也没有别的星星那么亮，但她有一颗特别温柔的心。每天晚上，她都会眨着亮晶晶的眼睛，安安静静地守着夜空。","有一天，小星星低头往下望，她看见一间温暖的小房子。窗户里透出橘黄色的灯光，一位妈妈正坐在床边，轻轻地拍着一个圆滚滚的小肚子，嘴里哼着一首好听的曲子。","小星星听啊听，她觉得那首曲子比天上的任何声音都好听。她好想送给这位妈妈和这个还没出生的小宝宝一份礼物。","可是星星能送什么礼物呢？她没有双手，不能包礼物；她没有口袋，不能装糖果。小星星有点发愁。","她跑去问月亮婆婆。月亮婆婆弯着银白色的眉毛，笑眯眯地说：「小傻瓜，你本身就是礼物呀。你的光，就是这世上最温柔的守护。」","小星星歪着脑袋想了想，她决定要做一件特别的事情。","从那天起，每当那位妈妈哄小宝宝睡觉的时候，小星星就把自己调到最亮、最温柔的模式。她不像流星那样急匆匆地划过，也不像烟花那样噼里啪啦地炸开——她只是安安静静地，在窗外的那一小片天空里，一闪，一闪，像一颗挂在天上的小夜灯。","她还请来了风姐姐。风姐姐轻轻地、轻轻地，从窗户缝里溜进去，把院子里的茉莉花香带进了房间。那香味淡淡的，像妈妈在宝宝额头上落下的吻。","她还请来了蟋蟀弟弟。蟋蟀弟弟在窗台下的草丛里，拉起了他的小提琴——「蛐蛐，蛐蛐，蛐——」声音轻轻的，软软的，像一首专门为小宝宝写的催眠曲。","有一天晚上，月亮婆婆特别高兴，她在天上铺开了一条银色的小路，从星星的家一直铺到那扇小窗户。小星星沿着这条小路，慢慢地滑下来——当然，她不会真的掉下来，她只是把自己暖暖的光，顺着月光一起，轻轻地洒进了房间。","小宝宝虽然还在妈妈的肚子里，但好像什么都感觉到了。他在水里翻了个小小的跟头，把妈妈的肚皮顶起了一个圆圆的小包。","妈妈低下头，温柔地摸了摸那个小包，笑着说：「你是不是也看见窗外的那颗小星星啦？她每天晚上都来陪我们呢。」","小星星在天上听见了，高兴得整颗心都亮了起来。她知道了，原来礼物不需要很大，不需要很贵重。一颗愿意陪伴的心，一束愿意守护的光，就是最好的礼物。","后来，小宝宝出生了。那是个有着亮晶晶眼睛的小婴儿。妈妈给他取了一个名字，叫做「小辰」。因为「辰」就是星星的意思。","每天晚上，当妈妈哄小辰睡觉的时候，她都会指着窗外的那颗小星星，轻轻地说：「看，那是你的守护星。她在你还没出生的时候，就开始爱你了。」","而小星星呢，她依然每天晚上都守在那扇窗户外面，一闪，一闪，用最温柔的光，守护着这个她用尽全心去爱的孩子。","因为她知道——爱，是世界上唯一不会熄灭的星光。"]},{"id":"2026-07-19-cn","date":"2026年7月19日 · 星期日","dateShort":"07/19","title":"雨滴在云里等（胎教期）","language":"zh","ageGroup":"prenatal","ageLabel":"胎教期","preview":"云妈妈的口袋里，住着一滴小小的雨。她圆圆的，透明的，还没去过地面，也没闻过泥土的味道...","moral":"等待不是空的。等待里装着所有的期盼、所有的温柔、所有还没说出口的爱。当你终于来到这个世界，你会发现——你等的人，也在等你。","content":["云妈妈的口袋里，住着一滴小小的雨。她圆圆的，透明的，还没去过地面，也没闻过泥土的味道。","小雨滴每天趴在云的边沿上，往下看。她看见田野、河流、小房子。其中一栋小房子的窗户亮着橘黄色的灯，灯里有一位妈妈，正轻轻地拍着圆圆的肚子，嘴里哼着歌。","小雨滴想下去。她想去看看那扇亮着灯的窗户。听说那肚子里住着一个还没来的小宝宝，跟小雨滴一样，也在等。","云妈妈说：「再等等。雨要落下去，得等风准备好了，得等土地渴了，得等太阳把云晒得暖暖的、软软的。」","小雨滴等啊等。她听云妈妈讲地面的故事——讲小草怎么从泥土里钻出来，讲小溪怎么在石头之间弹钢琴，讲花儿怎么在风里点头。","「地面是什么感觉？」小雨滴问。","「地面是温暖的。」云妈妈说，「像一双一直在等你的手。」","有一天，风来了。风从很远的地方来，带着田野的味道，带着花香，还带着一个声音——一个妈妈在轻轻哼歌的声音。","小雨滴听见了那首歌。她觉得那首歌是在叫她。也许不是叫她，但那首歌的旋律刚好跟她心里的节拍一模一样。","云妈妈把口袋松了一点点。小雨滴滑到了口袋的边沿上。","「准备好了吗？」云妈妈问。","「准备好了。」小雨滴说。她不怕。因为她知道，下面有人在等——妈妈在等宝宝，土地在等雨，而她，正要去赴一场温暖的相遇。","小雨滴落了下去。风轻轻地托着她，不急，不慌。她穿过云层，穿过风，穿过鸟的翅膀旁边，穿过树叶的缝隙。","她落在了一片叶子上，嗒。又从叶子上滑到了泥土里，渗进去了。","泥土很黑，但很温暖。小雨滴觉得自己被什么柔软的东西包裹住了，像被一双手轻轻捧着。","泥土里，有一颗种子，也在等。种子感觉到雨来了，动了一下，好像在说：「你来了。」","小雨滴和种子，在泥土里相遇了。一个从天上来的，一个在地里等的。它们谁也没说话，但都觉得——原来等了这么久，就是为了这一刻。","窗户里，妈妈的歌还在轻轻地响。她不知道，她的歌叫来了一滴雨，而雨叫醒了一颗种子。","每一个等待，都在等一个相遇。而每一个相遇，都让等待变得值得。"]},{"id":"2026-07-19-en","date":"2026年7月19日 · 星期日","dateShort":"07/19","title":"The Pond Sleeps Too (Prenatal)","language":"en","ageGroup":"prenatal","ageLabel":"Prenatal","preview":"The pond goes shhh-shhh when the sun goes down. The cattails go swish-swish at the edge. The old willow goes sway-sway over the water...","moral":"When everything around you breathes slow and soft, you can breathe slow and soft too. The pond knows how to sleep. The moon knows how to wait. And you - you know how to be still, even if you don't know it yet.","content":["The pond goes shhh-shhh when the sun goes down.","The cattails go swish-swish at the edge. The old willow goes sway-sway over the water.","A small duck, name of Pip, floats on the pond. Pip is brown. Pip is small. Pip is doing nothing. Just floating.","The bullfrog says: rummm... rummm... rummm... from the mud. Low and slow and round, like a belly full of warm soup.","The fireflies come out. Blink... blink... blink... Like tiny lanterns that someone forgot to blow out.","Mama Duck paddles over. Paddle, paddle, paddle. She settles next to Pip. She doesn't say anything. She just settles. The water barely moves.","The moon comes up. It comes up slow, slow, slow - like it's being very careful not to wake anything up.","The moon puts a silver road on the water. It goes from the edge of the pond all the way to where Pip is floating. Pip doesn't know it's there. But the road is there.","Shhh-shhh says the water. Rummm-rummm says the frog. Blink-blink say the fireflies.","A fish jumps - plop - and the ripples go round and round and round, getting bigger and softer, until they disappear into the dark.","The old willow drops a leaf. The leaf falls slow, slow, slow - side to side, side to side - and lands on the water without a sound. It floats there, like a tiny green boat.","Pip's eyes go heavy. Pip tucks his beak under his wing. Warm. Close. Mama is here.","The whole pond goes still. Not dead-still - alive-still. The kind of still that means everything is breathing together. The water, the frog, the fireflies, the duck, the moon.","Shhh... shhh... shhh...","The pond sleeps too."]},{"id":"2026-07-20-cn","date":"2026年7月20日 · 星期一","dateShort":"07/20","title":"月光写的一封信（胎教期）","language":"zh","ageGroup":"prenatal","ageLabel":"胎教期","preview":"月亮给一栋小房子写了一封信。信很短，只有一句话：嘘，我在。风当邮差，把信从天上送下来...","moral":"有些爱，不需要语言，不需要文字。一束光，一阵风，一个小小的动作，就够了。你知道的——有人一直在你头顶亮着。","content":["月亮给一栋小房子写了一封信。","信很短，只有一句话：嘘，我在。","风当邮差，把信从天上送下来。风轻轻地，轻轻地，从窗户缝里溜进去。","信落在妈妈的肚子上。","妈妈没看见信，但宝宝看见了。宝宝在暖暖的羊水里，翻了个身，像在拆信。","信没有字，只有月光。月光是软的，是凉的，是一根银色的线，从天上一直牵到妈妈肚子里。","宝宝顺着这根线，往上摸了摸。他摸到了月亮。","月亮说：我每天晚上都给你写信。","宝宝不会说话，但他动了一下，像在回信。","月亮笑了。月亮的笑，就是一整片亮。","那天晚上，小房子里的灯灭了，月光没灭。","月光从窗户缝里渗进来，铺在地板上，铺在被子上，铺在妈妈的手背上。","妈妈睡得很沉。她不知道，月光在替她守着宝宝。","宝宝在月光里，安安静静地浮着。他抓着那根银色的线，线的另一头，是月亮。","月亮什么也没做。只是亮着。","但宝宝觉得很安心。","因为有些陪伴，不需要做什么。亮着，就够了。","嘘，我在。","每天晚上，月亮都会写这封信。信永远只有一句话，但那句话，比所有的故事都长。"]},{"id":"2026-07-20-en","date":"2026年7月20日 · 星期一","dateShort":"07/20","title":"The Hush-Hush Tree (Prenatal)","language":"en","ageGroup":"prenatal","ageLabel":"Prenatal","preview":"Deep in the hush of the Whispering Wood, where the moss grows soft and the silence is good, there stood a tall tree with a curious sound - it went hush, hush, hush, all the way round...","moral":"There's a hush that's not 'be quiet' - it's 'you're safe now, you can rest.' The whole world is full of that hush, if you know how to hear it. And you will.","content":["Deep in the hush of the Whispering Wood, where the moss grows soft and the silence is good, there stood a tall tree with a curious sound - it went hush, hush, hush, all the way round.","Not a loud hush, not a scoldy-type hush. Not a 'be-quiet-you' hush or a 'hurry-up' hush. It was soft as a feather on fur on a rug. It was warm as a hug from a big fuzzy bug.","The Hush-Hush Tree stood with its branches spread wide, and out of its leaves came a sound soft and slow - a sound like a shush that was saying 'it's time to let go.'","Now, nobody knew where the hush-hush came from. Not the fox with his socks, not the mole with his drum, not the owl on the bough (who said 'Hoo? Hoo? Hmm?').","But a small mother bird who had built her small nest right there in the Hush-Hush Tree's branches - she knew. She had five small eggs, round and warm, and she sat on them every night from dusk until dawn.","And the hush-hush sound went shhhh... shhhh... shhhh... and the eggs didn't wiggle, and the eggs didn't squirm. They just sat in the nest, warm and still, like a handful of smooth round stones in the sun.","The mother bird sang: 'Hush little ones, hush little ones, hush. The world is still turning, but we don't need to rush. The stars are all waking, the moon's on her way. Close your small eyes - it's the end of the day.'","And the Hush-Hush Tree went shhhh... shhhh... shhhh... like it was singing along.","The wind came to visit, the way that wind does. It tickled the leaves and it made the branches buzz. But even the wind, when it passed through the tree, went 'hush' instead of 'whooo' - it couldn't help but agree.","The fireflies came, blink-blink-blink, one by one. The crickets came, chirp-chirp-chirp, under the moon. And each one of them, when they came to the tree, got quieter and quieter - as quiet as could be.","And down in the world, past the Whispering Wood, past the meadow and stream, past the houses that stood - in one of those houses, a window glowed gold. And inside the window, a mother (I'm told) was holding her belly and humming a tune, a soft little melody, under the moon.","And that melody floated right up through the air, past the chimney and rooftop, past everywhere - all the way to the Hush-Hush Tree, where it landed on a leaf like a drop of warm tea.","And the tree drank it in, and the hush got softer. And the eggs in the nest got warmer and softer. And the mother bird smiled - or as much as a bird can smile - and she whispered: 'Goodnight.'","Shhhh... shhhh... shhhh... went the Hush-Hush Tree.","And the whole wide world went as soft as could be."]},{"id":"2026-07-21-cn","date":"2026年7月21日 · 星期二","dateShort":"07/21","title":"风知道你的名字（胎教期）","language":"zh","ageGroup":"prenatal","ageLabel":"胎教期","preview":"风轻轻吹，草轻轻摇，月亮轻轻走过山岗。风从山岗上跑下来，路过一棵老槐树，路过一片芦苇荡，路过一栋亮着灯的小房子...","moral":"你的名字，是这世界对你说的第一句情话。在你还没来到之前，风已经帮你传开了，水已经帮你记住了。你来了，满世界都在喊你。","content":["风轻轻吹，草轻轻摇，月亮轻轻走过山岗。","风从山岗上跑下来，路过一棵老槐树，路过一片芦苇荡，路过一栋亮着灯的小房子。","小房子的窗户开着一条缝。风从缝里溜进去，带进来桂花的香、泥土的潮，和远处小溪叮叮咚咚的声音。","妈妈坐在床边，一只手拍着圆圆的肚子，另一只手放在嘴边，好像在说什么悄悄话。","风竖起耳朵，听了听。","妈妈在说一个名字。一遍，又一遍。轻轻的，像在念一首只有两个字的诗。","风记住了那个名字。","风从窗户里出来，往田野跑。它跑过小溪，小溪叮叮咚咚，风把那个名字告诉了水。水记住了，叮叮咚咚地唱着那个名字。","风跑过老槐树，老槐树沙沙响，风把那个名字告诉了树叶。树叶记住了，沙沙沙沙地念着那个名字。","风跑过芦苇荡，芦苇轻轻摇，风把那个名字告诉了月光。月光记住了，把那个名字写在了每一片叶子的尖尖上，亮晶晶的。","风跑累了，回到小房子的屋檐上歇脚。它往下看，看见妈妈已经睡着了，手还放在肚子上。","风想，宝宝还不知道，自己的名字已经被整个世界记住了。","等宝宝来了，他会发现：溪水在叫他的名字，树叶在念他的名字，月光在写他的名字。","他一来到这个世界，就会被叫一声。那一声，全世界一起喊。","叮叮咚咚。沙沙沙沙。嘘——嘘——。","都是那个名字。","风轻轻地吹，草轻轻地摇。月亮轻轻地走过山岗，带着那个名字，走过每一扇亮着灯的窗。"]},{"id":"2026-07-21-en","date":"2026年7月21日 · 星期二","dateShort":"07/21","title":"The Old River Tells a Story (Prenatal)","language":"en","ageGroup":"prenatal","ageLabel":"Prenatal","preview":"Well now, you listen here, and I'll tell you something about the Old Muddy that most folks don't know. The river talks. Not loud - a river doesn't need to be loud...","moral":"The river has been telling stories since before there were people to listen. And it's been saving one - just for you. When you're ready, go down to the water and sit. It'll tell you. It's been waiting.","content":["Well now, you listen here, and I'll tell you something about the Old Muddy that most folks don't know.","The river talks. Not loud - a river doesn't need to be loud. It talks the way an old man talks on a porch at sundown: slow, and easy, and not in any particular hurry to get to the point.","The river talks to the banks. It talks to the willows. It talks to the catfish and the turtles and the herons that stand in the shallows like they've got all the time in creation, which - being herons - they probably figure they do.","But the river's best talking? That happens at night. When the steamboats have gone and the lanterns are dim and the only ones still awake are the river and the moon.","That's when the river tells stories.","It tells about the spring floods, when it gets up over its banks and goes roaming through the bottoms like a dog that's slipped its leash. It tells about the summer doldrums, when it gets so low and slow you could walk across it and barely wet your knees. It tells about the winter ice, when it goes hard and quiet, and you can hear it groaning in the dark, like a man turning over in bed.","But there's one story the river tells that's different from the rest. It's not about floods or ice or catfish the size of dogs. It's about a sound.","'There's a sound,' the river says (or the river would say, if rivers could talk, which I'm telling you they can), 'that I've been hearing for a while now. It comes from a house on my bank. It's small - smaller than a cricket, smaller than a raindrop. But it's got a rhythm to it.'","The moon, who's been listening to the river's stories for as long as there've been rivers and moons, asks: 'What kind of rhythm?'","'A heartbeat rhythm,' the river says. 'Thump... thump... thump. Slow and steady, like a small drum in a small room.'","'Whose heartbeat?' the moon asks.","The river doesn't answer right away. It gurgles over a rock - that's river for 'let me think.' Then it says: 'There's a woman in that house who's been coming down to my bank every evening. She puts her hand on her belly and she hums. And under the hum, I can hear it - thump... thump... thump. Two heartbeats. One big, one small. The small one is new.'","The moon knows what that means. The moon has seen more new heartbeats than anybody. The moon says: 'That's a baby.'","'I know,' says the river. 'But the baby hasn't come yet. It's still in there, still growing, still thumping away. I can hear it getting stronger every week.'","'What are you going to do?' the moon asks.","The river thinks about this for a long time. Water goes over rocks. A fish jumps - plop. A frog says rummm.","'I'm going to keep talking,' the river says. 'I'm going to keep flowing past that house, nice and easy, so the baby can hear me. When it's born, it'll know my sound. It'll know the Old Muddy. And maybe - maybe - when it's old enough, it'll come down to the bank and sit, and listen, and the river will tell it stories.'","'Like what stories?' the moon asks.","'Like this one,' the river says.","And the river flowed on, under the moon, past the house with the two heartbeats, carrying its story downstream - where it would be told again, and again, and again, to every child who ever sat on a riverbank and wondered what the water was saying."]},{"id":"2026-07-22-cn","date":"2026年7月22日 · 星期三","dateShort":"07/22","title":"小闹钟学唱歌（胎教期）","language":"zh","ageGroup":"prenatal","ageLabel":"胎教期","preview":"孩子们，你们知道吗？每个闹钟都会唱歌。可不是「叮铃铃」那种歌，是一种更轻、更慢的歌，是专门哄小宝宝睡觉的歌...","moral":"声音最大的不一定最有力量。最轻的声音，反而能让人放下所有的紧张，安心入睡。你的心跳也是这样——轻轻地跳，却陪了你一辈子。","content":["孩子们，你们知道吗？每个闹钟都会唱歌。","可不是「叮铃铃」那种歌，是一种更轻、更慢的歌，是专门哄小宝宝睡觉的歌。","后来啊，有一个小闹钟，住在床头柜上，它就特别想学这首歌。","小闹钟问闹钟妈妈：「妈妈妈妈，我什么时候才能学会哄觉的歌呀？」","闹钟妈妈说：「你得先学会，把自己的声音调到最小。嘀嗒嘀嗒，不能再响了，得变成嘀——嗒——嘀——嗒——，慢悠悠的。」","小闹钟试了试。嘀嗒嘀嗒嘀嗒。不行，太快了，像小兔子蹦。","它又试了试。嘀——嗒——嘀——嗒——。嗯，好一点了，像老乌龟爬。","闹钟妈妈说：「还不够。你得把声音再放轻，轻到像羽毛落在棉花上。」","小闹钟使劲儿把声音调小。嘀————嗒————。这一回，声音小得几乎听不见了。","可你猜怎么着？正因为太小了，你反而会竖起耳朵，认认真真地听。这可就对了。","闹钟妈妈笑了：「闹钟的歌，不是为了让人听见，是为了让人安静下来。」","小闹钟明白了。它开始嘀——嗒——嘀——嗒——，一声一声，不急不慌，像一只温柔的手掌，一下一下拍着后背。","床头柜旁边，妈妈哄着肚子里的宝宝。宝宝的呼吸，慢慢地跟小闹钟的嘀嗒声合拍了。","嘀——嗒——。宝宝的心跳。","嘀——嗒——。妈妈的手掌。","嘀——嗒——。小闹钟的歌。","三个声音叠在一起，变成了一首只有三拍的摇篮曲。","小闹钟可得意了。它想，原来闹钟不只是用来叫人起床的，闹钟也能哄人睡觉呀。","嘀——嗒——。嘀——嗒——。","晚安，小闹钟。晚安，小宝宝。明天早上，小闹钟会叫你们起床的。但现在，先好好睡一觉吧。"]},{"id":"2026-07-22-en","date":"2026年7月22日 · 星期三","dateShort":"07/22","title":"The Mama Robin's Counting Song (Prenatal)","language":"en","ageGroup":"prenatal","ageLabel":"Prenatal","preview":"In the old maple by the fence, there's a robin's nest. Mama Robin built it herself - twigs and mud and grass, pressed together with her chest, round and smooth and strong...","moral":"Before you come into the world, someone is already counting you. Not days, not weeks - heartbeats. One, two, three, four. Each one a promise. Each one a 'you're almost here.'","content":["In the old maple by the fence, there's a robin's nest.","Mama Robin built it herself - twigs and mud and grass, pressed together with her chest, round and smooth and strong. She built it in the fork of two branches, where the wind couldn't reach.","In the nest are four eggs. Blue as a spring sky after rain. Smooth and small and warm.","Every evening, when the sun goes down behind the barn and the fireflies come out, Mama Robin settles on the nest. She covers the eggs with her soft brown body, and she counts.","She doesn't count out loud. She counts with her heartbeat.","Thump. One egg. Thump. Two eggs. Thump. Three eggs. Thump. Four eggs.","Four heartbeats back. Four tiny thumps, so small you'd need to be a bird to feel them, pulsing up through the warm blue shells.","Papa Robin sits on the fence, not far away. He doesn't say anything. He just sits. Sometimes he turns his head - left, right, left - watching the yard, the barn, the lane. Keeping watch.","The crickets start. Chirp, chirp, chirp - like a thousand small clocks winding themselves for the night.","The old dog on the porch sighs - a big, round, contented sigh - and puts his head on his paws.","The barn owl, who lives in the hole in the barn's peak, opens one yellow eye. Checks the yard. Closes it. All's well.","Mama Robin shifts her weight. The eggs roll, just a tiny bit, settling deeper into the warmth.","Thump. Thump. Thump. Thump. Four eggs. Four heartbeats. One nest.","The moon comes up over the maple. It comes up slow and round and silver, like a dinner plate someone left in the sky.","The moonlight comes through the leaves and makes dappled patterns on the ground - round, bright spots that move when the wind moves, like they're alive.","Mama Robin's eyes close. Her beak tucks under her wing. But her body stays warm, and her heart keeps counting.","Thump. One. Thump. Two. Thump. Three. Thump. Four.","Someday soon, those four thumps will become four beaks, tapping from the inside. And the shells will crack - tik, tik, tik - and four small mouths will open, and four small voices will say, in their own way: 'I'm here. I'm here. I'm here.'","But not yet. Not tonight.","Tonight, it's just Mama Robin, and the eggs, and the moon, and the counting.","Thump. Thump. Thump. Thump.","Goodnight, maple. Goodnight, moon. Goodnight, four small hearts, beating in the dark."]},{"id":"2026-07-23-cn","date":"2026年7月23日 · 星期四","dateShort":"07/23","title":"云的口袋里装着梦（胎教期）","language":"zh","ageGroup":"prenatal","ageLabel":"胎教期","preview":"天上有一朵很软很软的云。它长得像一只懒洋洋的猫，整天在天空里慢慢地飘。云有一个口袋。口袋里装的不是雨，不是雪，是梦...","moral":"有一个梦在等你，从你还没来就开始等了。它空空的，扁扁的，专门留给你。等你来了，你的第一个梦就会装进去——那个梦会是全世界最干净、最温柔的，因为你的心还什么都没碰过。","content":["天上有一朵很软很软的云。","它长得像一只懒洋洋的猫，整天在天空里慢慢地飘。","云有一个口袋。口袋里装的不是雨，不是雪，是梦。","每一朵云都有一个口袋，都装着梦。梦是透明的，软软的，像棉花糖化开以后的样子。","这朵云的口袋里，有一个特别小的梦。别的梦都圆滚滚的，它却扁扁的，像还没有装满。","云问它：「你怎么这么小呀？」","小梦说：「因为我还在等一个人。那个人的梦还没做完，我才能装满。」","「等谁？」","小梦不说话了。它趴在口袋边沿上，往下看。","它看见了一栋小房子。窗户亮着。里面有一位妈妈，拍着圆圆的肚子，嘴里哼着歌。","小梦的眼睛亮了：「就是他。」","「他还没出生呢。」云说。","「我知道。所以我还不能装满。我得等他来了，把他做的梦一点一点装进来。他的第一个梦，一定很小很小，小到只有一粒沙那么大。但那个梦会是最干净的，最软的，因为他的心还什么都没碰过。」","云想了想，说：「那你慢慢等。我飘得慢一点。」","于是云飘啊飘，飘过了山岗，飘过了河流，飘过了一片又一片田野。它飘得特别慢，慢到地上的老鹰都笑话它：「你这是什么云呐，比蜗牛还慢！」","云不理它。云知道，口袋里有一个小梦在等，所以不能颠簸，不能跑太快，不然梦会洒出来的。","每天晚上，云都会飘到那栋小房子的上空，停下来。小梦从口袋边沿往下看，看见妈妈在拍肚子，看见灯灭了，看见月亮升起来了。","有一天，妈妈拍着拍着，肚子动了一下。","小梦激动地抖了抖：「他动了！他是不是在做梦了？」","云笑了：「也许吧。也许他在梦里翻了个身。」","小梦等着。它知道，等那个小宝宝来到这个世界，它的第一个梦就会装进自己的身体里。到那时候，它就不扁了，它就圆了，就饱满了。","而且它知道，那个梦会是全世界最温柔的梦——因为那个梦的主人，还没有见过这个世界的任何一丁点儿不好。","在他看来，一切都是新的，一切都是好的，一切都值得放进梦里。","小梦耐心地等着。云耐心地飘着。月亮耐心地亮着。","它们都在等同一个孩子。"]},{"id":"2026-07-23-en","date":"2026年7月23日 · 星期四","dateShort":"07/23","title":"The Snuggle Bug Who Couldn't Sleep (Prenatal)","language":"en","ageGroup":"prenatal","ageLabel":"Prenatal","preview":"In the crumbly-crumbly corner of the Snuggle-Bug Wood, where the softest of mosses grow soft as they could, there lived a small Snuggle Bug - name of Piddle-dee-Pip - who could NOT get to sleep, not a wink, not a bit!...","moral":"Sleep is shy. You can't chase it. But if you hold something soft, and listen to a hum, and stop trying so hard - it'll come. It always comes, when you stop chasing and start being.","content":["In the crumbly-crumbly corner of the Snuggle-Bug Wood, where the softest of mosses grow soft as they could, there lived a small Snuggle Bug - name of Piddle-dee-Pip - who could NOT get to sleep, not a wink, not a bit!","'Oh BOTHER and FUSS!' said Piddle-dee-Pip. 'I've wiggled and jiggled and turned and I've flipped! I've counted the stars - I got up to eleven! I've counted the clouds - I ran out at seven! I've tried sleeping on leaves, I've tried sleeping on bark, I've tried sleeping upside down in the dark!'","But nothing worked. Piddle-dee-Pip's eyes were WIDE open. Like two small round windows with nobody home in them.","Along came a friend - a big fuzzy Bear - name of Humphrey-dee-Doo, with fur everywhere, and a smile like a warm honey bun, and a voice like a kettle that's just about done.","'Why, Piddle-dee-Pip! You're still AWAKE?' said Humphrey-dee-Doo, with a worried sort of shake. 'The moon's been up for an HOUR at least! The fireflies have gone to their small firefly feast! The crickets have sung all their cricket-y songs! What's keeping you up when the whole world's gone wrong?'","'I don't KNOW!' said Piddle, and sniffled a bit. 'I'm tired - I'm SO tired - but sleep just won't sit! It flies away! It runs away! It hides behind the tree! I chase it and chase it, but it won't come to me!'","Humphrey-dee-Doo sat down with a THUMP. He folded his big fuzzy arms in a lump. He thought and he thought and he thought some more, and his thinking made the sound of a low gentle snore - which was ironic, but Piddle didn't notice, on account of being too busy being upset.","'I've got it!' said Humphrey, and his eyes went all bright. 'You're chasing sleep, and sleep doesn't like to be chased!'","'It doesn't?' said Piddle.","'No!' said Humphrey. 'Sleep is shy. Sleep comes when you're not looking. Sleep comes when you're so busy NOT-chasing that you forget you were trying!'","'But how do I NOT-chase something I'm trying to chase?' asked Piddle, who was confused, which is a perfectly reasonable way to feel when a bear tells you to stop chasing something you've been chasing all night.","'Easy,' said Humphrey. 'You do something else. Something warm. Something soft. Something that has nothing to do with sleeping.'","'Like what?'","'Like...' Humphrey looked around. He picked up a small handful of moss. He put it in Piddle's hands. 'Feel this.'","Piddle felt it. It was soft. Very, very soft. Like the top of a kitten's head, if the kitten was made of green.","'Now close your eyes,' said Humphrey, 'and just feel the moss. Don't think about sleeping. Don't think about stars. Don't think about counting or clouds or anything. Just... feel.'","Piddle closed his eyes. He felt the moss. It was soft. It was warm. It was there.","Humphrey started to hum. Hmmmm... hmmmm... hmmmm... Not a song. Just a hum. Like a bumblebee that's too tired to buzz.","Piddle felt the moss. He heard the hum. He felt the warm. He felt the close.","And something happened.","Sleep didn't come running. Sleep didn't come flying. Sleep just... settled. Like a leaf on still water. Like snow on a mitten. Like a small warm thing finding a warm soft place and deciding to stay.","Piddle's breathing went slow. Piddle's hands went loose. The moss slipped to the ground - plop - but Piddle didn't notice.","Humphrey smiled. He tucked his big fuzzy arm around Piddle, and he kept humming. Hmmmm... hmmmm... hmmmm...","And the moon, who'd been watching the whole thing from up in the sky, smiled too. Because the moon knows a thing or two about patience. The moon takes all night to cross the sky, and it never hurries, and it always gets there.","'Goodnight, Piddle-dee-Pip,' said Humphrey, very soft.","'Goodnight, Humphrey-dee-Doo,' said the moon, even softer.","And the Snuggle-Bug Wood went quiet - all except the hum."]},{"id":"2026-07-24-cn","date":"2026年7月24日 · 星期五","dateShort":"07/24","title":"梦还没来（胎教期）","language":"zh","ageGroup":"prenatal","ageLabel":"胎教期","preview":"后来啊，有一只小猫，叫兜兜。兜兜有一个特别的本事——它能看见梦。人的梦，在人的头顶上飘着，五颜六色的。小孩的梦是粉的，大人的梦是灰的，老人的梦是金的...","moral":"你的第一个梦，正从天上慢慢飘来。它一路收集了风、露水、月光和鸟叫。等你来到这个世界，那个梦就到了——它是全世界最干净、最香的梦，因为它为你攒了一路的温柔。","content":["后来啊，有一只小猫，叫兜兜。兜兜有一个特别的本事——它能看见梦。","人的梦，在人的头顶上飘着，五颜六色的。小孩的梦是粉的，大人的梦是灰的，老人的梦是金的。","可兜兜发现了一件怪事。森林边上的小房子里，那位妈妈肚子里的宝宝——他的头顶上，什么也没有。","兜兜歪着脑袋想了半天。别人的头顶上都有梦，怎么这个宝宝没有呢？","它跑去问猫头鹰爷爷。猫头鹰爷爷整天坐在树洞里，什么都知道。","「猫头鹰爷爷，那个还没出生的小宝宝，头顶上怎么没有梦呢？」","猫头鹰爷爷睁开一只眼睛：「他的梦还没来呢。」","「没来？梦也会迟到？」","「不是迟到。」猫头鹰爷爷慢悠悠地说，「是他的梦还在路上。你看——」","猫头鹰爷爷用翅膀往天上一指。兜兜抬头一看，哎呀！天上有一团特别小特别小的光，正慢慢地、慢慢地往下飘。那团光比萤火虫还小，比蒲公英的绒毛还轻。","「那是他的梦。」猫头鹰爷爷说，「每个宝宝的梦都是从天上来的。梦要飘很久很久，才能飘到宝宝头顶上。」","「为什么这么慢呀？」","「因为梦在路上要收集东西。它要收集一阵风，收集一滴露水，收集一片月光，收集一声鸟叫。收集够了，才能变成一个完整的梦。那个梦才够香，够甜，够软。」","兜兜想帮忙。它跳到屋顶上，对着天上的那团小光喊：「嘿——快点下来！宝宝快出生了！」","小光没理它。它还是慢慢地飘，好像在说：急什么，好东西得慢慢来。","兜兜只好等着。每天晚上，它趴在屋顶上，看着那团小光近了一点点，又近了一点点。","有一天晚上，小光终于飘到了小房子的上空。它在屋顶上停了停，好像在喘口气。","兜兜激动地竖起尾巴：「到了到了！」","小光慢慢地从烟囱里钻进去——兜兜觉得这太冒险了，万一被烟熏黑了怎么办——不过小光没事，它是梦，不怕烟。","小光飘进了卧室，飘到了妈妈的肚子上，然后轻轻一闪，不见了。","兜兜趴在屋顶上，等了一会儿。","然后，它看见了。妈妈的肚子上方，出现了一个很小很小的、粉色的梦。扁扁的，软软的，像一小朵棉花糖。","那是宝宝的第一个梦。","兜兜笑了。猫头鹰爷爷在树洞里也笑了。","你猜宝宝的第一个梦是什么？兜兜看不见梦里的内容，但它看见那个梦的颜色——是全世界最浅最浅的粉，像刚出生的朝霞，像还没被碰过的花瓣。","那颜色，干净得让人心里发软。"]},{"id":"2026-07-24-en","date":"2026年7月24日 · 星期五","dateShort":"07/24","title":"The Toymaker's Last Song (Prenatal)","language":"en","ageGroup":"prenatal","ageLabel":"Prenatal","preview":"There was once a toymaker who lived at the end of a lane that nobody walked down anymore, in a shop that leaned slightly to the left, like a man who'd been standing for a very long time and had gotten tired...","moral":"Some songs aren't written yet. They're waiting for the right person to arrive - someone who hasn't been born, maybe, but who's already listening. When you get here, there'll be a song with your name on it. You just have to be ready to hear it.","content":["There was once a toymaker who lived at the end of a lane that nobody walked down anymore, in a shop that leaned slightly to the left, like a man who'd been standing for a very long time and had gotten tired.","His name was Mr. Coggle, and he was very old. He'd been making toys for so long that his fingers looked like the wooden dolls he made - knobbly and smooth and worn at the joints.","Mr. Coggle had made every kind of toy you could think of. Clockwork trains. Spinning tops. Jack-in-the-boxes that popped with a satisfying BOING. Dolls with eyes that opened and closed. Tin soldiers that marched. A music box that played a tune so beautiful it made grown men stand still in the street with a faraway look, which was very inconvenient if they happened to be carrying groceries.","But there was one toy Mr. Coggle had never made. He'd been saving the materials for it for forty years.","The materials were: a piece of cedar from his grandmother's hope chest, a brass spring he'd found in a clock when he was nine, a scrap of velvet from his mother's old dress, and a single hair from the head of the woman he'd loved, who had gone away a long, long time ago and taken all the music with her.","'What kind of toy is it?' asked the cat, who was orange and fat and had no business being in the shop, but was there anyway, because cats don't ask permission.","'It's not a toy, exactly,' said Mr. Coggle. He was shaping the cedar with a small knife, very carefully, the way you'd shape something that mattered. 'It's more of a... a song, in a box.'","'A music box?'","'No. A music box plays a song that's already been written. This plays a song that hasn't been written yet. A song for someone who hasn't heard it yet.'","The cat narrowed its eyes. Cats are suspicious of things they don't understand, which is most things.","Mr. Coggle worked all day and all night. He carved the cedar into a small, round box, smooth as an egg. He wound the brass spring inside, but he didn't attach it to any mechanism. He lined the inside with the velvet. And he wove the single hair - which was dark and fine and still smelled faintly of lavender - around the spring, like a thread around a spindle.","When he was done, the box sat on his workbench. It didn't do anything. It didn't play. It didn't open. It just sat there, looking like a small wooden egg, and doing a very good job of it.","'Well?' said the cat. 'Does it work?'","'It's not for me,' said Mr. Coggle. 'It's for someone who hasn't arrived yet.'","'Who?'","'I don't know,' said Mr. Coggle. And the strangest thing was - he smiled when he said it. A real smile, the kind that crinkles the corners of your eyes and makes you look, for a moment, like a young man instead of an old one.","He put the box in the window of his shop. And there it sat.","Weeks passed. Nobody came down the lane. Nobody noticed the box. The cat came and went, catching mice and making disapproving faces at things.","Then one evening, a woman walked down the lane. She was round in the middle, the way women are when they're carrying something precious and heavy and almost-ready. She walked slowly, the way you walk when each step is a negotiation with gravity.","She stopped at the window. She saw the box.","She didn't open the door. She didn't go in. She just stood there, looking at the small wooden egg in the window, and she put her hand on her belly, and she smiled.","And the box - the box that didn't play, that didn't open, that just sat there looking like a small wooden egg - hummed.","Just once. A single note. Low and warm and round, like the first note of a song that's going to be very beautiful when it's finished, but isn't finished yet.","The woman heard it. Or maybe she felt it. Or maybe she just knew, the way you know things that you can't explain and shouldn't try to.","Mr. Coggle, inside the shop, heard it too. He closed his eyes. He was very old, and very tired, and he'd been waiting a very long time.","'There you are,' he said, to nobody, or to everybody, or to the note that was hanging in the air like a held breath. 'I've been waiting for you.'","The note faded. The box went quiet. The woman walked on, slowly, back up the lane, into the evening.","But something had changed. The lane didn't look so forgotten. The shop didn't lean quite so far to the left. And the cat, who was sitting in the window where the box had been, was purring - though there was nobody left to hear it.","Well, that's not quite true. There was somebody. Somebody very small, and very new, and very warm, who hadn't been born yet, but who had just heard the first note of a song that would last their whole life."]},{"id":"2026-07-25-cn","date":"2026年7月25日 · 星期六","dateShort":"07/25","title":"啾啾的摇篮曲","language":"zh","ageGroup":"prenatal","ageLabel":"胎教期","preview":"森林里住着一只很小很小的小鸟，她的名字叫啾啾。啾啾的个子只有一颗橡果那么大，羽毛是浅浅的鹅黄色，像一朵会飞的小迎春花...","moral":"世界上最温柔的声音，不是最响亮的那一个，而是用心收集、轻轻送出的那一个。你来到这个世界之前，风在等你，水在等你，树叶在等你——它们把最好听的声音攒在一起，编成了一首只属于你的歌。愿你在这首歌里安心入睡，也愿你长大以后，把这份温柔继续唱给身边的人听。","content":["森林里住着一只很小很小的小鸟，她的名字叫啾啾。啾啾的个子只有一颗橡果那么大，羽毛是浅浅的鹅黄色，像一朵会飞的小迎春花。","啾啾有一副好嗓子，森林里的小动物都爱听她唱歌。可啾啾心里一直藏着一个愿望——她想学一首全世界最软、最轻、最温柔的摇篮曲。","大家问她：「你又不是妈妈，为什么要学摇篮曲呢？」啾啾歪着小脑袋，认真地回答：「因为在森林边上的那栋小房子里，有一位妈妈的肚子里，正住着一个还没有出生的小宝宝。我想等他来到这个世界的那一天，送他一首歌。」","啾啾拍拍翅膀，决定出发去寻找最温柔的声音。","她先飞到了山间的小溪旁。小溪从高高的石头上跌下来，溅起一串串水花，「哗啦啦，哗啦啦」地唱着歌。啾啾站在溪边的鹅卵石上，认真地听了好久好久。","「小溪姐姐，你的声音真好听，可不可以借给我一点点？」啾啾问。","小溪笑了起来，水面上泛起一圈一圈的酒窝：「我的声音太活泼啦，小宝宝听了会想蹦蹦跳跳的。不过，你可以把我最安静的那一段带走——就是月亮升起来的时候，我流过水草，『沙沙沙』的那一小段。那是我一天里最轻的声音。」","啾啾高兴地把「沙沙沙」收进了心里。她的胸口暖暖的，像装了一小团柔软的水草。","接着，她飞到了一棵很高很高的老槐树上。老槐树的叶子又多又密，风一吹，就发出「簌簌簌」的声音，像老爷爷在翻一本很旧很旧的书。","「槐树爷爷，您的声音好沉稳，好安心。可不可以借给我一点点？」","老槐树慢悠悠地抖了抖树枝，落下几片叶子，像是在点头：「我的声音太沉啦，小宝宝听了会觉得像在坐船。不过，你可以把我傍晚的那一段带走——就是晚风刚刚起来的时候，我的叶子互相说悄悄话，『窸窸窣窣』的那一小段。那是我一天里最温柔的声音。」","啾啾把「窸窸窣窣」也收进了心里。现在她的胸口装了两样东西，一小团水草的声音，和一小把叶子说悄悄话的声音。","最后，她飞到了一片芦苇荡。月光洒在芦苇上，每一根芦苇都亮亮的，像一根银色的琴弦。微风吹过，芦苇们轻轻摇晃，发出「嘘——嘘——」的声音，又轻又长，像是有人在很远很远的地方，吹着一支看不到的竹笛。","啾啾什么也没说，只是安安静静地站在芦苇尖上，闭上眼睛，让那个「嘘——嘘——」的声音，像一条银色的丝线一样，慢慢地绕进了她的心里。","现在，啾啾的心里装了三样东西——小溪的「沙沙沙」，老槐树的「窸窸窣窣」，还有芦苇荡的「嘘——嘘——」。它们混在一起，像一条软软的、暖暖的小毯子，在啾啾的心里轻轻地翻着、卷着。","啾啾试着唱了唱。啊呀，不对。她唱出来的声音太响了，像是在开一场森林音乐会。小宝宝需要的不是音乐会，小宝宝需要的是——一个轻轻的、暖暖的、像被抱在怀里一样的声音。","啾啾有点沮丧。她低着头，飞回了森林边上那栋小房子旁边的老榆树上。月亮已经升得老高老高了，小房子的窗户里，透出昏黄的灯光。","啾啾看见，那位妈妈正坐在摇椅上，一只手轻轻地、慢慢地拍着圆圆的肚子，另一只手翻着一本图画书。她的嘴唇在轻轻地动，好像在给肚子里的小宝宝念一个故事。","啾啾忽然明白了。她明白了为什么小溪说「把最安静的那一段带走」，为什么老槐树说「把傍晚说悄悄话的那一段带走」——因为最温柔的摇篮曲，不是一首很厉害的歌，而是一个人在你身边，轻轻地、慢慢地、不慌不忙地陪着你。","就像妈妈拍肚子的节奏。就像心跳的节奏。","啾啾深吸了一口气，把心里的三样声音揉在一起，揉成了一缕比月光还细的声音。然后，她张开小嘴巴，轻轻地、轻轻地唱了起来——","「沙沙沙」，像水流过水草。「窸窸窣窣」，像叶子说悄悄话。「嘘——嘘——」，像芦苇在月光里摇晃。","这首歌没有词，只有声音。可这些声音拼在一起，刚好是一颗心脏跳动的节奏——「咚，咚，咚，咚」——不快不慢，不轻不重，像一只温柔的手掌，一下一下地，拍着一个小小的、暖暖的后背。","妈妈好像听见了。她抬起头，朝窗外望了望，看见了老榆树枝头那只鹅黄色的小小鸟。她笑了，把窗户推开了一点点缝。","啾啾的歌声就顺着那条缝，像一缕月光一样，轻轻地溜了进去。它绕过窗帘，绕过床头的小台灯，最后落在了妈妈圆圆的肚子上——轻轻地，像一片羽毛。","肚子里的小宝宝动了动。不是那种大大的踢腿，而是一种很轻很轻的、像翻了个身的动。就好像他在妈妈的肚子里，听见了这首歌，然后安心地换了一个更舒服的姿势。","妈妈低下头，摸了摸肚子，眼睛弯弯的，轻声说：「宝宝，你听见了吗？有只小鸟在给你唱摇篮曲呢。她一定飞了好远好远的路，才找到这么温柔的声音。」","啾啾在树枝上听见了这句话，整只鸟都暖烘烘的。她忽然觉得，自己飞过的每一段路，听过的每一种声音，都是为了这一刻——为了把全世界的温柔，编成一首歌，送给一个还没出生的小宝宝。","从那以后，每天晚上，月亮升起来的时候，啾啾都会飞到老榆树上，把那首没有词的摇篮曲，轻轻地唱给小房子听。妈妈会打开窗户，让歌声飘进来，飘到她的肚子上，飘到小宝宝的耳朵里。","小宝宝在歌声里一天一天地长大。他学会了在妈妈肚子里翻跟头，学会了打哈欠，还学会了——在啾啾唱歌的时候，安安静静地、一动不动地，好像在认真地听。","后来有一天，小宝宝出生了。那是个胖乎乎的小家伙，哭声特别响亮。可当护士把他抱到妈妈怀里的时候，他还在哭。","妈妈轻轻地拍着他的后背，可他还在哭。窗外的啾啾急了，她飞到窗台上，用最轻最轻的声音，唱起了那首没有词的摇篮曲——「沙沙沙，窸窸窣窣，嘘——嘘——」","奇迹发生了。小家伙的哭声一点一点地小了下去。他的小拳头松开了，他的小脚丫不蹬了，他的眼睛慢慢地、慢慢地闭上了。他在妈妈怀里，安安静静地睡着了，嘴角还挂着一个很小很小的、像是微笑的弧度。","妈妈抬起头，看见窗台上那只鹅黄色的小鸟，眼眶一下子就红了。她用口型轻轻地说了一句：「谢谢你。」","啾啾歪了歪小脑袋，拍拍翅膀，飞回了森林里。月光洒在她鹅黄色的羽毛上，把她变成了一只会飞的小灯笼。","她想，原来最温柔的摇篮曲，是走遍全世界，把最好的声音收集起来，再轻轻地、轻轻地，放在一个新生命的耳边。","她想，原来每一个来到这个世界的小宝宝，都值得一首专门为他而唱的歌。","而她，一只只有橡果那么大的小鸟，却把整个世界的温柔，都唱进了一首歌里。"]},{"id":"2026-07-25-en","date":"2026年7月25日 · 星期六","dateShort":"07/25","title":"The Creek That Sang Itself to Sleep (Prenatal)","language":"en","ageGroup":"prenatal","ageLabel":"Prenatal","preview":"Down in the hollow where the ferns grow tall, where the stones are all mossy and the water's so small - there runs a creek that goes tinkle-tink-tink, and it runs all day long, and it runs all night, I think...","moral":"The world is full of songs that go on without stopping - the creek, the wind, the cricket, the frog. They don't stop for night. They just get softer. And if you listen - really listen - you'll hear them singing you to sleep. They've been singing all along.","content":["Down in the hollow where the ferns grow tall, where the stones are all mossy and the water's so small - there runs a creek that goes tinkle-tink-tink, and it runs all day long, and it runs all night, I think.","The creek goes tinkle-tink-tink over the stones. It goes shhhh-shhhh-shhh where the water hits the mud. It goes gurgle-gurgle-gurgle where it passes under the old log bridge, and it goes plip-plop-plip where it drips off the last rock at the end, into the deep pool where the big fish live (well, big for a creek - about the size of your hand).","The creek has a voice. Not a loud voice. Not a show-offy voice. A working voice - the kind of voice that's always there, like the hum of a fridge, like the tick of a clock, like the breathing of someone sleeping next to you.","When the sun goes down behind the ridge, the creek keeps going. Tinkle-tink-tink. It doesn't stop for night. It doesn't know what night is. It just knows: keep going, keep singing, keep moving over the stones.","The fireflies come out. Blink, blink, blink. They land on the ferns by the creek. The ferns don't mind. The creek doesn't mind. Everything by the creek is the not-minding kind.","A raccoon comes down to the water. Dip-dip-dip go his little hands. He's looking for crawfish. He doesn't find any. He doesn't mind. He washes his hands anyway - raccoons are like that, they'll wash their hands whether there's anything to wash them for or not.","The moon comes up. Big and round and slow, like a wheel of cheese rolling across the sky. The moonlight lands on the creek, and the creek turns silver, and the tinkle-tink-tink gets a little bit softer, like even the water wants to be gentle.","The crickets start. Chirp-chirp-chirp. The creek doesn't mind. It adds them to its song. Tinkle-tink-tink-chirp. Shhhh-shhhh-chirp. Gurgle-gurgle-chirp.","The bullfrog says: rummm... rummm... rummm... The creek doesn't mind. It adds that too. Tinkle-tink-rummm. Shhhh-shhh-rummm.","And slowly, slowly, slowly, the creek's song gets softer. And slower. And softer and slower. Until it's not really a song anymore - it's more like a breathing. In and out. Tinkle... shhhh... tinkle... shhhh...","The raccoon falls asleep in the ferns, with his wet little paws tucked under his chin.","The fireflies blink slower and slower and slower, until they're just tiny dots of light that might be stars, or might be reflections, or might be nothing at all.","The creek keeps going. But now it's going slow. Very slow. Like it's walking on tiptoe. Like it's trying not to wake anyone up.","Tinkle... tink... tink...","Shhhh... shhh... shhh...","The moon watches over the hollow. The ferns bend low. The creek breathes in, and breathes out, and breathes in, and breathes out.","And somewhere, not far from the creek, in a house with a warm yellow window, a mother is humming. And the creek hears the humming, and adds it to its song. And the mother hears the creek, and adds it to her hum.","And two songs become one song. And the one song becomes sleep."]},{"id":"2026-07-26-cn","date":"2026年7月26日 · 星期日","dateShort":"07/26","title":"露珠邮递员（胎教期）","language":"zh","ageGroup":"prenatal","ageLabel":"胎教期","preview":"天还没亮透的时候，竹林里每一片叶子上都住着一个小小的露珠邮递员。他们背着亮晶晶的小包裹，排成细细的队伍，沿着叶脉往下滑。","moral":"世界上最美的等待，就是知道有人正穿过晨雾、越过山岗，只为把温柔送到你身边。","content":["天还没亮透的时候，竹林里每一片叶子上都住着一个小小的露珠邮递员。他们背着亮晶晶的小包裹，排成细细的队伍，沿着叶脉往下滑——吧嗒，吧嗒，吧嗒——像一串没有声音的铃铛。","最小的那个露珠邮递员叫小晶晶。她是昨晚的月色凝成的，圆溜溜的，透明的，风一吹就轻轻晃一晃，像一颗会呼吸的珍珠。今天轮到小晶晶送信——一封从山那边寄来的信，信封上画了一朵云，云里面写着：\"收信人——住在竹林东边第一个鸟窝下方第三片草叶上的妈妈。\"","小晶晶深深吸了一口气——她吸的是晨雾的味道，凉凉的、甜甜的，还有一点点竹叶的清香。\"走啦！\"她对自己说，然后沿着叶脉往下滑——咕噜咕噜，咕噜咕噜——像坐滑梯一样，一直滑到叶尖尖上。","叶尖尖下面是一片苔藓，软软的、绿绿的，像一块绿色的小地毯。小晶晶跳了下去——啪——在苔藓上弹了弹，没有碎，稳稳地站住了。她开心地晃了晃身体，亮晶晶的水光在苔藓上一闪一闪的。","接下来要爬过一块大石头。石头上有细细的纹路，像老爷爷额头上的皱纹。小晶晶一步一步，小心地绕过那些纹路。有一道纹路里住着三只蚂蚁，它们正在做早操——\"一二三四，二二三四\"——看见小晶晶，都停了下来。\"你背着的是什么呀？\"最小的那只蚂蚁问。小晶晶挺了挺圆鼓鼓的身子，说：\"是一封很重要的信，要送给草叶上的妈妈。\"三只蚂蚁齐声说：\"那你快去吧，我们帮你把前面的路扫干净。\"","蚂蚁们用触角把小路上的尘土扫开，小晶晶顺利地走了过去。\"谢谢你们！\"她回头喊了一声，亮晶晶的身体在阳光里闪着七彩的光。","然后是穿过一片枯叶。枯叶是去年秋天落下来的，已经变成了褐色，上面有虫虫咬出的小洞洞。小晶晶从一个小洞里钻过去——啵——身体被洞口挤成了椭圆形，过了洞口又弹回圆圆的形状，好玩极了。枯叶下面藏着一只小蜗牛，正在慢悠悠地吃早餐。\"嗨，小露珠，你这么急去哪儿呀？\"蜗牛慢吞吞地问，一个字还没说完，小晶晶已经从另一个洞洞里钻出去了。","终于到了一片矮矮的草丛。小晶晶数着：\"第一片草叶，第二片草叶，第三片草叶——就是这里！\"第三片草叶的根部长着一朵小小的野菊花，菊花的旁边，一位妈妈正静静地坐着。她不是人类的妈妈，是一只纺织娘。纺织娘妈妈的怀里抱着六颗淡绿色的小小的卵，她用薄薄的翅膀轻轻地盖着它们，嘴里哼着温柔的曲子：\"睡吧，睡吧，我的小宝贝，风在林子外面等着呢，等你们醒来，它就带你们去看世界……\"","小晶晶屏住呼吸——她怕自己\"啵\"的一声破了——慢慢地、慢慢地靠近。她走到纺织娘妈妈的脚边，把背上的小包裹递了过去。小包裹在空气中自己展开了——原来里面装着的不是信纸，而是一小段歌声。那歌声从山那边飘过来的，是一个爸爸的声音，他唱着和纺织娘妈妈一模一样的曲子：\"睡吧，睡吧，我的小宝贝，我在山这边等着呢……\"","纺织娘妈妈听着听着，眼睛湿润了。她低下头，看见脚边小小的露珠邮递员，小晶晶已经快要被太阳晒得透明了，却还努力地举着那封歌声信。\"谢谢你，小晶晶。\"纺织娘妈妈说，然后把那首歌又唱了一遍，唱给怀里的六颗小卵听，也唱给已经快要蒸发了的小晶晶听。","小晶晶听着听着，觉得自己变轻了、变淡了，慢慢升了起来，升到草叶上空，升到竹林的顶上，变成了一缕看不见的水汽。但她很开心——因为她知道，那封信已经送到了。那位妈妈和那六颗还没出生的小宝宝，都听到了从山那边飘来的歌。","第二天的清晨，竹林里又结出了新的露珠。其中有一颗圆圆的小露珠，在叶尖上醒来的时候，发现自己背上已经有一个亮晶晶的小包裹在等她了。下一个邮递员继续出发。吧嗒，吧嗒，吧嗒——穿过晨雾，越过山岗，把温柔送到每一个等待的角落。"]},{"id":"2026-07-26-cn-01","date":"2026年7月26日 · 星期日","dateShort":"07/26","title":"小豆豆的觉觉（0-1岁）","language":"zh","ageGroup":"0-1","ageLabel":"0-1岁","preview":"哎呀呀，天黑啦，月亮出来啦。小豆豆的小手手揉揉眼睛，该觉觉喽。滴答，滴答，小闹钟在说话。呼——呼——窗外的风在说话...","moral":"世界在轻轻地说晚安。风在说，虫在说，月亮在说，妈妈的心跳也在说。所有的声音都在告诉你：安心睡吧，明天还会来。","content":["哎呀呀，天黑啦，月亮出来啦。","小豆豆的小手手揉揉眼睛，该觉觉喽。","滴答，滴答，小闹钟在说话。","呼——呼——窗外的风在说话。","知了知了，窗外的小虫在说话。","小豆豆竖起小耳朵，听呀听。","妈妈抱起小豆豆，摇呀摇，摇呀摇。","咚咚，咚咚。那是妈妈心跳的声音，好稳，好暖。","小豆豆贴着妈妈的胸口，听见了咚咚声。","好安心呀。好暖和呀。","滴答，滴答。呼——呼——。咚咚，咚咚。","三个声音在唱歌，唱一首觉觉的歌。","小豆豆的小嘴嘴打了个小哈欠。啊——","小豆豆的小眼皮，沉甸甸，沉甸甸。","慢慢合上啦。呼噜，呼噜。小豆豆睡着啦。","月亮偷偷看了一眼，笑了。它把光光调得柔柔的，轻轻地盖在小豆豆身上，像一条银色的小被子。","晚安，小闹钟。晚安，小风风。晚安，小虫虫。","晚安，小豆豆。明天见。"]},{"id":"2026-07-26-cn-13","date":"2026年7月26日 · 星期日","dateShort":"07/26","title":"小蚂蚁搬馒头渣（1-3岁）","language":"zh","ageGroup":"1-3","ageLabel":"1-3岁","preview":"老槐树底下，住着一只小蚂蚁，名字叫丁丁。丁丁个子小小的，可勤快了，每天一大早就爬出洞，这儿看看，那儿瞧瞧，找好吃的...","moral":"一个人搬不动的时候，找朋友帮忙不是丢脸的事。大家一起来，事情就变轻了。朋友多了，路就好走了。","content":["老槐树底下，住着一只小蚂蚁，名字叫丁丁。","丁丁个子小小的，可勤快了，每天一大早就爬出洞，这儿看看，那儿瞧瞧，找好吃的。","这天呀，丁丁在老槐树根底下，发现了一大块馒头渣！","白白的，软软的，比丁丁的身体大十倍！好家伙，够全家吃两天的。","丁丁高兴极了，赶紧跑过去，使劲儿搬。嘿哟，嘿哟！","搬不动。","丁丁换了个方向，从后面推。嘿哟，嘿哟！","还是搬不动。","丁丁又换了方向，从侧面顶。嘿哟，嘿哟！嘿——哟——！","馒头渣纹丝不动，倒好像在笑丁丁：小不点儿，别费劲儿啦。","丁丁急了，触角甩得啪啪响。怎么办呢？怎么办呢？","这时候，丁丁的好朋友胖胖爬过来了。胖胖胖乎乎的，走路一摇一摆，像个小肉球。","「丁丁，你在这儿干啥呢？」胖胖问。","「我发现了一块大馒头渣，可我搬不动！」丁丁说。","胖胖一看，眼睛都亮了：「好家伙，真大！我帮你！」","两个小蚂蚁，一前一后，嘿哟嘿哟，使劲儿搬。","馒头渣晃了晃，动了那么一点点。","「还差点儿！」丁丁说。","这时候，瘦瘦的豆豆也来了。豆豆腿长，跑得快。","「我来！我来！」豆豆在中间一扛。","嘿哟嘿哟！三个小蚂蚁一起使劲儿。","馒头渣骨碌骨碌，动起来了！","三只小蚂蚁高兴得触角碰触角，啪啪啪。","他们一边走一边喊号子：「一二三，搬搬搬！一二三，搬搬搬！」","馒头渣就这么一点一点，搬回了蚂蚁洞。","蚂蚁奶奶看见了，笑得合不拢嘴：「哎哟喂，我的好孩子们，真能干！」","那天晚上，蚂蚁洞里开馒头渣大餐。丁丁、胖胖、豆豆，吃得肚皮圆滚滚的。","丁丁想，一个人搬不动的时候，找朋友帮忙，不丢脸。大家一起来，事情就变轻了。","胖胖想，馒头渣真甜。","豆豆想，明天还得再找一块大的。","老槐树上的知了叫了起来：知了——知了——它好像也在说：知道了，知道了，朋友多了路好走。"]},{"id":"2026-07-26-cn-36","date":"2026年7月26日 · 星期日","dateShort":"07/26","title":"会说话的小书包（3-6岁）","language":"zh","ageGroup":"3-6","ageLabel":"3-6岁","preview":"后来啊，闹闹有了一个新书包。蓝色的，上面印着一只会眨眼的恐龙。闹闹可喜欢了。可是你猜怎么着？这个书包会说话...","moral":"大人说的「不许这样」「不许那样」，有时候不一定对。聪明的孩子会自己想一想，这事合不合道理。合道理的，就大胆去做。","content":["后来啊，闹闹有了一个新书包。","蓝色的，上面印着一只会眨眼的恐龙。闹闹可喜欢了，上学第一天就背着它，颠儿颠儿颠儿地跑了。","可是你猜怎么着？这个书包会说话。","可不是嘛。那天放学，闹闹走在胡同里，书包突然小声说了一句：「闹闹，你橡皮掉了。」","闹闹低头一看，可不嘛，橡皮就在脚边上。他赶紧捡起来塞进书包。","「你……你会说话？」闹闹小声问。","「当然会啦。」书包说，声音闷闷的，因为拉链没拉开。「我是个有想法的书包。怎么了，不行吗？」","闹闹乐了。从此，他和书包成了好朋友。","书包可有意思了，它有好多想法。","有一天，闹闹的数学考砸了，只得了六十分。他把卷子往书包里一塞，不想让妈妈看见。","书包说：「闹闹，这样不好吧。」","「有什么不好？妈妈看见了要骂我的。」","「可是藏起来，她就不知道你哪里不会呀。她不知道，就没法帮你。你下次还是不会。」","闹闹想了想，觉得书包说得有道理。他咬咬牙，回家把卷子拿给了妈妈。","你猜怎么着？妈妈没骂他，反而陪他一道一道把错题弄明白了。","闹闹对书包说：「你说得对。」","书包得意地晃了晃（虽然它没有腿，但闹闹感觉它晃了晃）。","又有一天，学校搞活动，要求每个同学带一样「最宝贝的东西」来分享。","闹闹犯了难。他最宝贝的东西是书包，可书包不想让别人看见自己会说话。","「你为什么不想让别人知道你会说话？」闹闹问。","书包叹了口气：「你想啊，要是别人知道我会说话，他们就会天天来翻我，让我说这说那。我可不想变成一个表演的工具。我是你的书包，只跟你说话，这多好。」","闹闹想了想，觉得书包说得对。有些好东西，就是自己知道的，不用给所有人看。","可是带什么呢？闹闹翻箱倒柜，找到了一个铁皮小青蛙，一捏就蹦。","「就带这个吧！」闹闹说。","「行。」书包说，「不过闹闹，我问你一个问题。」","「你说。」","「你们老师说，带最宝贝的东西。可你最宝贝的明明是我，你为什么不带我？」","闹闹愣住了。是呀，为什么不带书包呢？","「因为……因为你会说话，我不想让别人发现。」","「可你不带我去，不就是因为怕别人发现我的秘密吗？那我岂不是成了你的……麻烦？」","闹闹的心一下子揪起来了。他从来没想到，书包会这么想。","「你不是麻烦！」闹闹急了，「你是我最好的朋友！」","「那为什么不能带我？」","闹闹想了很久很久。后来，他做了一个决定。","第二天，闹闹背着书包去了学校。分享的时候，他站起来说：","「我最宝贝的东西，是我的书包。它不会说话，但它一直陪着我，装着我的课本、我的橡皮、我的卷子。它是我的好朋友。」","全班同学都看着闹闹，有的笑了，有的觉得他好奇怪。但是闹闹不介意。","因为书包在他背上，轻轻晃了晃。闹闹知道，那是书包在说：谢谢你。","回家的路上，书包说：「闹闹，你真勇敢。」","「有什么勇敢的？」","「你敢带一个不会说话的普通书包去，还敢说它是最宝贝的。别人可能觉得你好笑，但你不怕。这叫勇敢。」","闹闹笑了。他摸了摸书包上那只会眨眼的恐龙。","「大人说，不许跟书包说话，因为书包不会说话。可我觉得，如果一个东西陪你这么久，它就是有想法的，管它会不会说话呢。」","书包没吭声，但闹闹觉得它在笑。","那天晚上，闹闹做了一个梦，梦见书包长出了小短腿，跟着他一起去冒险。恐龙图案活了过来，在书包上跑来跑去。","醒来的时候，闹闹觉得，这世界真有意思。有些规矩，是给不懂事的大人定的。"]},{"id":"2026-07-26-cn-6plus","date":"2026年7月26日 · 星期日","dateShort":"07/26","title":"罐头里的城（6岁以上）","language":"zh","ageGroup":"6+","ageLabel":"6岁以上","preview":"孩子们，今天我给你们讲一件真事儿——嗯，至少我奶奶说是真的。那年她才九岁，在胡同口的小卖部买了一个罐头。罐头打开以后，里面不是黄桃，不是橘子，而是一座小小的城...","moral":"大人们说，这件事不可能，那件事不可能。可「不可能」三个字，往往是偷懒用的——懒得去想，懒得去看，懒得承认自己不知道。真正的勇敢，是面对不知道的东西时，先别急着说不。","content":["孩子们，今天我给你们讲一件真事儿——嗯，至少我奶奶说是真的。","那年她才九岁，叫小月，住在南锣鼓巷边上的一条胡同里。胡同口有个小卖部，卖糖葫芦、卖冰棍、卖汽水，还卖一种铁皮罐头。","那罐头上贴着一张发黄的纸条，写着三个字：「别打开」。","小月问小卖部的王奶奶：「这罐头里是啥呀？」","王奶奶说：「不知道。厂家寄来的，就这一罐。没人敢打开。你要是敢，就送你了。」","小月拿着罐头，颠了颠，轻飘飘的，好像里面什么也没有。","「别打开」三个字，搁在别的小孩身上，可能就算了。可小月不是别的小孩。她是那种老师越说「不许往墙上画画」，她越想往墙上画的小孩。","回到家，她把罐头搁在桌上，看了三天。第四天放学，她终于忍不住了——啪，拉开了盖儿。","你猜怎么着？","罐头里不是黄桃，不是橘子，也不是什么都没有。","罐头里是一座小小的城。","城很小，小得能放在手心里。城里头有房子，有街道，有路灯。再仔细看——哎哟喂，还有小小的人在走动！","小月趴在桌上，瞪大了眼睛看。她看见那城里的街道上，有小小的人在赶路，有小小的车子在跑（不知道是什么动的，可能是风）。街边有个小小的早点摊，一个胖乎乎的小人在炸油条。","小月「哇」了一声，吹了口气。","那口气对于小城里的人来说，大概是十二级台风。","油条摊子翻了，胖小人抱着脑袋跑，旁边的小人们也四散奔逃。","小月吓了一跳，赶紧缩回脑袋，不敢出气了。","过了一会儿，小城恢复了平静。胖小人把油条摊子扶起来，继续炸油条。小月看得目瞪口呆——这油条，得有多小啊？比头发丝还细吧？","她忽然觉得，自己像个巨人，又像个怪物。","这时候，罐头里传出来一个声音，细细的，像蚊子哼：","「那个……上面的大姑娘，能不能别吹气了？」","小月低头一看，城里最高的一栋楼的楼顶上，站着一个小人儿，穿西装，戴眼镜，手里拿着一个喇叭。","「你……你能看见我？」小月小声问。","「能啊。」小人说，「你是我们城里的传说。我们管你们叫『天上的大脸』。」","「天上的大脸？」小月差点笑出声。","「别笑，」小人说，严肃得很，「你一笑，对我们来说就是地震。」","小月赶紧憋住。她觉得这个城虽然小，但里头的人可认真了。","小人说：「我叫甄市长。我们罐头城，有个问题想请教您。」","「我？」小月指着自己的鼻子，「我一个九岁小孩，能帮你们什么？」","「正因为你是小孩，我们才找你。」甄市长推了推眼镜，「大人的罐头，我们试过，打不开。可你打开了。这说明——只有小孩能看见我们，能听见我们。」","小月觉得这事儿越来越有意思了。","甄市长说：「我们罐头城的灯光，快灭了。我们的灯是靠『真话』点亮的——城里的人说真话，灯就亮。可是最近，说真话的人越来越少，灯就一盏一盏灭了。再这么下去，全城就得黑灯瞎火了。」","「那……你们为什么不说真话？」","甄市长叹了口气：「因为说假话省事啊。说假话，不用得罪人。说假话，不用负责任。说假话，大家都笑嘻嘻的。可笑着笑着，灯就灭了。」","小月想了想，好像有点明白。她们班上也这样。明明那个同学做的手工不好看，可大家都说「真棒真棒」。明明那个同学的作文写得很一般，可老师说「写得不错」。大家笑嘻嘻的，可谁也不说真话。","「那……要我做什么？」","「你帮我们找一句话。」甄市长说，「一句真正的真话。不是那种『今天天气真好』的真话——是真的、从心底里说出来的、别人听了会愣一下的那种真话。有了这句话，灯就能重新亮。」","小月皱起眉头：「什么话才算『真正的真话』？」","「这个我们也不知道。」甄市长老老实实地说，「但我们知道——真话一说出来，你会知道的。因为罐头城的灯，会应一声。」","小月想了一晚上。","什么才是「真正的真话」呢？","「我今天作业写完了」是真话，但好像不够「真」。「妈妈做的饭不好吃」是真话，但说了会挨打。「我喜欢上学」……嗯，这个不一定是真话。","她翻来覆去地想，想得睡不着。","第二天放学，她路过胡同口，看见王奶奶在小卖部门口打瞌睡。旁边摆着几串糖葫芦，有一串的糖稀掉了，露出光秃秃的山楂。","小月本来想走，又停住了。","她回头，小声说：「王奶奶，那串糖葫芦的糖稀掉了，不好卖了。」","王奶奶睁开眼，愣了一下，然后笑了：「哎哟，还是你这孩子实在。别人都不跟我说。来，这串送你了，我再穿一串好的。」","小月拿着两串糖葫芦往家走。忽然——","她口袋里的罐头，亮了一下。","就一下。像是有人在里面划了一根火柴。","小月把罐头掏出来，打开盖儿一看——罐头城里，最中间那盏路灯，亮了。","亮起来的那盏灯，正好在油条摊旁边。炸油条的胖小人抬头看了看灯，又低头继续炸油条，脸上好像在笑。","甄市长在楼顶上对她挥了挥小旗子。","小月忽然明白了。","「真正的真话」，不是什么大道理，不是什么惊天动地的话。就是——该说的时候，说了。哪怕只是告诉王奶奶，她的糖葫芦坏了。","从那天起，小月开始试着说真话。","她对同学说：「你那个手工，纸糊歪了，要不我帮你弄弄？」同学先是不高兴，后来发现小月真的帮她弄好了，俩人成了好朋友。","她对妈妈说：「妈，今天这个汤有点咸。」妈妈先瞪了她一眼，然后自己也尝了一口，说：「还真是。」","每说一次真话，罐头城就亮一盏灯。","一个星期以后，罐头城全城都亮了。","甄市长用喇叭对小月说：「谢谢您！我们全城亮了！您真是个了不起的小孩！」","小月说：「我也没做什么呀，就是说真话。」","甄市长说：「对啊。就是『说真话』这三个字，难倒多少大人。」","后来，罐头城的盖子就再也打不开了。小月试了好几次，都不行。","可她不难过。因为她知道，罐头城在某个地方，亮堂堂地过日子。那里的灯，靠真话点亮。而她学会了说真话——这比一个会发光的罐头，值钱多了。","孩子们，我奶奶讲完这个故事，对我说了一句话，我一直记到现在。她说：","「大人们说，这件事不可能，那件事不可能。可『不可能』三个字，往往是偷懒用的——懒得去想，懒得去看，懒得承认自己不知道。你记住了，真正的勇敢，是面对不知道的东西时，先别急着说不。」","我把这句话，送给你们。"]},{"id":"2026-07-26-cn-test-bingbo","date":"2026年7月26日 · 星期日","dateShort":"07/26","title":"萤火虫想变成星星（冰波风格·胎教期）","language":"zh","ageGroup":"prenatal","ageLabel":"胎教期","preview":"夏天的夜晚，草地上升起一盏一盏小小的灯。那是萤火虫提着灯笼，在找一颗 lost 的星星。","moral":"每一个小小的光芒，都不必羡慕遥远的星辰。你发着光，就有人正被你照亮。","content":["夏天的夜晚，草地上升起一盏一盏小小的灯。那是萤火虫提着灯笼，在找一颗 lost 的星星。","「星星掉到哪里去了呢？」萤火虫自言自语。它的灯笼一闪，一闪，像在轻轻地问。","风听见了，风说：「我吹过整片田野，没有看见星星。但我闻到了桂花香，你要不要也闻一闻？」","萤火虫就停下来，闻了闻。桂花香是甜的，甜得像妈妈哼的歌。它心里软了一下，差点忘了要找星星。","它继续飞，飞过小溪。溪水叮叮咚咚，像有人在弹一架看不见的钢琴。萤火虫低头看，溪水里也有一盏小小的灯——那是它自己的倒影。","「原来我也会发光呀。」萤火虫对着水面说。水面上的萤火虫也对着它闪了闪，像在点头。","它又飞了一会儿，飞到一棵老槐树的枝头。老槐树的叶子沙沙响，像在讲一个很老很老的故事。","「你在讲什么呀？」萤火虫问。","「我在讲，」老槐树说，「很久很久以前，有一颗星星，它觉得自己不够亮，就从天上跳下来了。它落在草丛里，变成了一只小小的虫子，屁股后面挂着一盏灯。」","萤火虫愣住了。它低头看看自己屁股后面那盏小小的灯。","「那……那颗星星，后来回去了吗？」它小声问。","老槐树沙沙地笑了：「它不用回去了。因为它发现，草地比天空更需要一点光。天空已经有那么多星星了，可是草地到了晚上，黑漆漆的，什么也看不见。」","萤火虫没有说话。它飞起来，飞得很慢很慢。它看见草丛里有一只小蚂蚱，在黑暗里磕磕绊绊地跳；它看见一朵晚开的小花，在黑暗里找不到回家的蚂蚁。","萤火虫飞到小蚂蚱旁边，灯笼一闪一闪。小蚂蚱看见了光，不再磕绊了。","萤火虫飞到小花旁边，灯笼一闪一闪。蚂蚁借着光，找到了回家的路。","「原来，」萤火虫想，「我不必变成星星。我发着光，就有人正被这光照亮。」","夜更深了。草地上一盏一盏小小的灯，亮起来，又亮起来。那不是掉下来的星星，那是萤火虫——它们每一只，都是一颗决定留在地上的、温柔的星。"]},{"id":"2026-07-26-cn-test-jinbo","date":"2026年7月26日 · 星期日","dateShort":"07/26","title":"月亮走过的山岗（金波风格·胎教期）","language":"zh","ageGroup":"prenatal","ageLabel":"胎教期","preview":"月亮轻轻地，走过山岗。它走得很慢，像怕踩疼了山岗上的草。风轻轻吹，草轻轻摇，月亮轻轻走过山岗。","moral":"有些爱，是轻轻地来，轻轻地走，不惊动你，却一直都在。就像月亮，走过山岗，走过你的窗，走进你的梦里。","content":["月亮轻轻地，走过山岗。","它走得很慢，像怕踩疼了山岗上的草。","风轻轻吹，草轻轻摇，月亮轻轻走过山岗。","山岗下有一座小房子。小房子的窗户亮着，橘黄色的光，暖暖的。窗户里，有一位妈妈，正轻轻地拍着圆圆的肚子。","「宝宝，」妈妈说，「你听见月亮了吗？月亮在走路呢。」","月亮听见了妈妈的话。它停下来，趴在山岗上，往下看。它看见妈妈的手，一下，一下，像在数着什么。","月亮想，妈妈在数什么呢？","也许在数日子。数着数着，宝宝就要来了。","也许在数心跳。一下，两下，三下，像一首小小的鼓。","也许什么也没数。只是拍着，拍着，就觉得很安心。","月亮想帮妈妈做点什么。它把自己的光，调得柔柔的，像一床薄薄的被子，轻轻地盖在小房子的屋顶上。","风也想帮忙。它从山岗上跑下来，绕过窗户缝，把院子里桂花的香味，送进了房间。香味是淡淡的，甜甜的，像妈妈在对宝宝说：「嘘，我在呢。」","院子里那棵老槐树也想帮忙。它把叶子摇得沙沙响，沙沙响，像在唱一首很老很老的歌。那首歌，老槐树的妈妈唱给它听过，现在它唱给月亮听，唱给风听，唱给小房子里那位妈妈和还没出生的宝宝听。","「宝宝，」妈妈又说，「你听，月亮在唱歌呢。」","月亮不好意思地笑了。它不会唱歌呀。可是它想，也许，光是会唱歌的。只是要用很轻很轻的心，才听得见。","于是月亮把光，调到最轻最轻。它走过山岗，走过小房子，走过窗户，走过妈妈的手，走过宝宝还没睁开的小耳朵。","光，轻轻地，轻轻地，像一句没有人听见的话。","可是宝宝听见了。宝宝在妈妈圆圆的肚子里，动了一下。不是踢，是动了一下，像翻了个身，像换了个姿势，像一个还不会说话的孩子，用唯一会的方式，回答了一声——","「我听见了。」","月亮走过了山岗。走得很慢，很慢。","它想，原来有些爱，是不用说话的。轻轻地来，轻轻地走，不惊动你，却一直都在。","风轻轻吹，草轻轻摇，月亮轻轻走过山岗。走过今夜，也走过每一个，有人在等待的夜。"]},{"id":"2026-07-26-en","date":"2026年7月26日 · 星期X","dateShort":"07/26","title":"The Little Brook That Learned to Wait (Prenatal)","language":"en","ageGroup":"prenatal","ageLabel":"Prenatal","preview":"Way up in the rolling hills, where the morning mist curled like sleepy cats around the oak trees, there lived a tiny brook. She was so small that a squirrel could hop across her in one leap.","moral":"Some things take time to arrive, and the waiting itself is part of the gift. A gentle heart that learns to wait learns to love.","content":["Way up in the rolling hills, where the morning mist curled like sleepy cats around the oak trees, there lived a tiny brook. She was so small that a squirrel could hop across her in one leap, and her water ran so softly that you had to bend down very close to hear her sing: trickle-trickle, hush-hush, trickle-trickle, hush-hush.","The little brook had a job. Every morning, she carried messages from the top of the hill down to the valley below. A fallen petal from the wild rose bushes — that was a hello from the hilltop. A tiny pebble, smoothed round by the water — that was a story from somewhere upstream. The brook carried them all, trickle-trickle, hush-hush, never rushing, never stopping.","One misty morning, the oldest oak tree on the hill leaned down — creak, creak, creak — and whispered to the brook. 'Little one,' said the oak, his voice like wind through old branches, 'there is something special coming to the valley. Something small. Something new. Something that has never been here before. Could you wait for it?'","The little brook had never been asked to wait before. She was always moving, always flowing, always going somewhere. 'Wait?' she bubbled. 'How do you wait when you are made of running water?'","The old oak smiled — his bark crinkled like a thousand tiny smiles all at once. 'You wait by being gentle,' he said. 'You wait by singing softly. You wait by noticing every little thing along the way.'","So the little brook tried. She slowed her water to the gentlest trickle — barely a whisper, just enough to keep moving. She sang her quietest song: trickle... trickle... hush... hush... And she began to notice things she had never noticed before.","She noticed that the moss on her stones had tiny silver tips that caught the morning light. She noticed that a water beetle had built a nest under her bank — a little dome of mud and bubbles, with tiny beetle eggs inside, each one smaller than a pinhead. She noticed that when the sun hit her water at just the right angle, she made rainbows — not big shouting rainbows, but tiny quiet ones, no bigger than a baby's fingernail, that danced on the pebbles.","Day after day, the brook waited. Trickle-trickle, hush-hush. The wild roses bloomed and dropped their petals. The water beetle's eggs hatched into tiny swimming specks. The oak tree's leaves turned from spring-green to deep summer-green. And still the brook waited. She did not know what she was waiting for, exactly. But she trusted the old oak, and she trusted the waiting itself.","Then one evening, when the sky was the color of a ripening blueberry and the first star was just blinking awake, something changed. The air grew soft — softer than it had ever been. The wind stopped and held its breath. Even the crickets paused their night song for one long, hushed moment.","And then the brook heard it. A tiny sound. Not from the water, not from the wind, not from any creature in the valley. It came from a little house at the edge of the meadow. A sound so small that only someone who had been waiting — really waiting — could hear it.","Waaaaaaah. Waaaaaaah. A baby's first cry.","The little brook trembled with joy. Her water sparkled brighter than it had ever sparkled before. She wanted to rush down and see — but she remembered: be gentle. So she flowed, slow and soft, down the last stretch of hill, carrying a wild rose petal and a smooth round pebble as her welcome gifts. Trickle-trickle, hush-hush, welcome-to-the-world, welcome-to-the-world.","The old oak watched from the hilltop, his branches swaying in a breeze that felt like a blessing. 'You see,' he whispered to the night, 'the brook learned what the river never could. Some things are worth slowing down for.'","And every night after that, the little brook sang her quietest lullaby — trickle-trickle, hush-hush — flowing past the little house at the edge of the meadow, carrying her song to the baby who was learning to sleep under the stars. Trickle-trickle, hush-hush. Sleep, little one, sleep."]},{"id":"2026-07-26-en-01","date":"2026年7月26日 · 星期日","dateShort":"07/26","title":"Hush-a-Bye, Little Duck (0-1 yr)","language":"en","ageGroup":"0-1","ageLabel":"0-1 yr","preview":"Hush-a-bye, hush-a-bye, little brown duck. The pond goes shhh-shhh and the moon comes up. Kuplink, kuplank, kuplunk go the pebbles in the water...","moral":"The world is full of soft sounds that say goodnight — the water, the wind, the moon. And the softest sound of all is someone who loves you, breathing close.","content":["Hush-a-bye, hush-a-bye, little brown duck.","The pond goes shhh-shhh. The moon comes up.","Kuplink, kuplank, kuplunk — go the pebbles in the water. A little duck, name of Pip, floats on the pond. Pip is small. Pip is brown. Pip is sleepy.","Swish, swish, swish — go the cattails at the edge. Sway, sway, sway — goes the old willow tree.","Mama Duck says, 'Come, little Pip. Come, little one. Time for sleep. Time for done.'","Pip paddles, paddle-paddle-paddle. Pip comes to Mama. Mama tucks Pip under her wing. Warm. Soft. Close.","Shhh-shhh says the water. Hoo-hoo says the owl, far away. Kuplink, kuplank, kuplunk — a fish jumps, plop.","Mama hums. Hmmmm, hmmmm, hmmmm. It vibrates in her chest, warm like a drum.","Pip hears the hum. Pip feels the warm. Pip feels the close.","The fireflies blink — on, off, on, off — like tiny stars that got lost and fell in the reeds.","A bullfrog says: rummmm, rummmm, rummmm. Low and slow and round.","Shhh-shhh water. Hmmmm-hmmmm Mama. Rummmm-rummmm frog. Blink-blink firefly.","Pip's eyes go heavy. Pip's eyes go... slow... blink... close.","Hush-a-bye, hush-a-bye, little brown duck. The pond holds you. The moon watches. The whole wide world goes shhh.","Goodnight, pond. Goodnight, moon. Goodnight, little Pip, safe and warm, under Mama's wing.","Shhh. Shhh. Shhh."]},{"id":"2026-07-26-en-13","date":"2026年7月26日 · 星期日","dateShort":"07/26","title":"Mop the Puppy and the Big Blue Bucket (1-3 yr)","language":"en","ageGroup":"1-3","ageLabel":"1-3 yr","preview":"Mop was a puppy. A small, flopsy, tipsy puppy with ears like old socks. One morning, Mop found a bucket. A big blue bucket. It was sitting by the fence...","moral":"Sometimes the best adventures are the small ones — right in your own yard. And the best friends are the ones who share the mess with you.","content":["Mop was a puppy. A small, flopsy, tipsy puppy with ears like old socks.","One morning, Mop found a bucket. A big blue bucket. It was sitting by the fence.","Mop sniffed the bucket. Sniff, sniff, sniff. It smelled like water and old rubber and something else — something that made Mop's tail go thump-thump-thump.","Mop put one paw in the bucket. IN went the paw. Nothing happened.","Mop put the other paw in. IN went the other paw. Still nothing.","Mop climbed in the bucket. All the way in. Squish, squash — Mop was too big! But Mop didn't care. Mop sat in the bucket like a little king on a blue throne.","Then — BLOOP! — the bucket tipped. Over it went! Splash splash splash!","Out rolled Mop, ears over tail, tail over ears, right into a puddle of mud. Squelch, squish, squirt!","Mop was now a mud-puppy. A brown, drippy, grinning mud-puppy.","Along came Sal. Sal was a little girl with pigtails and a red dress. Sal was picking blueberries.","Kuplink, kuplank, kuplunk — went the blueberries in Sal's tin pail.","Sal looked at Mop. Mop looked at Sal.","'Oh, Mop!' said Sal. 'You are a MESS!'","Mop wagged his whole body, not just his tail. Mop was happy. Mop was always happy.","Sal sat down in the mud next to Mop. Plop. Now Sal was a mud-girl. A brown, drippy, grinning mud-girl.","Sal's mama came to the fence. She looked at Sal. She looked at Mop. She put her hands on her hips.","Then Sal's mama laughed. A big, round, rolling laugh, like a barrel going downhill.","'Well,' she said, 'I suppose that's what Saturdays are for.'","She brought the hose. Swish-swish-swish went the water. Clean went Sal. Clean went Mop. Clean went the blueberries that had rolled everywhere — kuplink, kuplank, kuplunk into the puddle.","Mop shook — SHAKE SHAKE SHAKE — water everywhere! Sal squealed and laughed.","And Sal's mama wrapped them both in a big warm towel, and carried them inside, and gave them warm bread with blueberry jam.","Mop fell asleep on the kitchen floor, dreaming of blue buckets and mud puddles and the sound of Sal laughing.","And Sal fell asleep at the table, with blueberry on her nose and jam on her chin.","And outside, the big blue bucket sat by the fence, waiting for tomorrow.","Because tomorrow, there would be another adventure. There always is, when you're small, and the world is big, and there's a bucket."]},{"id":"2026-07-26-en-36","date":"2026年7月26日 · 星期日","dateShort":"07/26","title":"The Gobblestop Machine of Professor Pifflewig (3-6 yr)","language":"en","ageGroup":"3-6","ageLabel":"3-6 yr","preview":"Now, you listen here, and I'll tell you a true story — well, true as stories get on Finchback Creek. There was a professor, name of Pifflewig, who built a machine that could gobble up sadness and turn it into something else entirely...","moral":"Sadness isn't something you can gobble up and throw away. But if you let someone sit beside you, and maybe tell a joke or two, the sadness gets smaller — not because it's gone, but because you're not carrying it alone.","content":["Now, you listen here, and I'll tell you a true story — well, true as stories get on Finchback Creek, where the catfish are as long as your arm and twice as sassy.","There was a professor. Name of Pifflewig. He lived in a crooked house on the hill above the creek, and he had more hair than sense, which is saying something, because he had a considerable amount of sense.","The professor was the sort of man who'd look at a teakettle and say, 'I wonder if I could make that fly.' And then he would. And then the teakettle would fly straight into Mrs. Grumpley's wash line, and there'd be clean underthings scattered across three counties, and Mrs. Grumpley would say words that are not fit for a children's story.","But I digress. This story is about the Gobblestop Machine.","The professor built it on a Tuesday. He was always building things on Tuesdays — he said Tuesdays had the right kind of wobble for invention.","The Gobblestop Machine was enormous. It had brass pipes and cogwheels and a funnel on top like an upside-down trumpet, and it went CLANK-A-CHUGGA-CHUGGA-WHIRRRR when you turned it on.","'What does it do?' asked young Tom Finch, who had come up the hill to see, on account of the noise being so loud it scared the chickens.","The professor beamed. His mustache wiggled like two caterpillars doing a dance. 'It GOBBLES sadness, my boy! You feed it in the top — and out the bottom comes something else entirely! Watch!'","The professor grabbed a jar. Inside the jar was a small grey cloud, sulking. It was, the professor explained, a jar of pure sadness, collected from old Mr. Hebble when his dog ran away.","He dumped the jar into the funnel. The machine went CLANK-A-CHUGGA-CHUGGA-WHIRRRR — and out the bottom rolled... a rubber chicken.","A rubber chicken that went SQUAWK when you squeezed it.","'You see?' said the professor. 'Sadness in, rubber chicken out! Brilliant!'","Tom Finch was not so sure. 'But Professor — what does old Mr. Hebble do with a rubber chicken?'","The professor hadn't thought of that. He scratched his head. His hair went in twelve directions at once.","They took the rubber chicken to Mr. Hebble. Mr. Hebble was sitting on his porch, looking at the empty spot where his dog's bowl used to be. He looked like a man who'd been rained on for a week.","Tom handed him the rubber chicken. Mr. Hebble looked at it. He squeezed it. SQUAWK.","Mr. Hebble did not laugh. He looked like he might cry again.","'It's not the same,' said Mr. Hebble, quiet-like. 'A chicken can't lick your face. A chicken can't sleep at the foot of your bed. A chicken don't miss you when you're gone.'","Tom Finch felt his heart go small in his chest. He looked at the professor. The professor's mustache drooped.","Well. The professor was not a man to give up. He went home and fiddled with the machine all night long. Sparks flew out the windows. Strange smells drifted across Finchback Creek. The machine went CLANK-A-CHUGGA-CHUGGA-WHIRRRR-BONG-ZIP-FIZZLE.","Wednesday morning, the professor came back. He did NOT bring a rubber chicken. He brought a box.","Inside the box was a small, furry, warm thing. It had big eyes and a waggy tail and it was, the professor admitted, not entirely a dog and not entirely a cat and not entirely anything you'd find in a book, but it was soft, and it was warm, and it had a heart that went thump-thump-thump.","'You can't gobble up sadness,' said the professor, 'and spit out the thing you lost. That's not how the world works. But I figured — maybe I could make something that needs taking care of. Something that'll look at you and say, 'You matter to me, you old rascal.'","Mr. Hebble held the furry thing. The furry thing licked his face. Mr. Hebble's mouth did something it hadn't done in a long time. It went up at the corners. It went up and up, until it was a smile, wobbly and wet, but real.","'You're an ugly little thing,' Mr. Hebble told the furry creature.","The furry creature wagged its tail harder.","Tom Finch went home that evening with a full heart. He thought about the professor's machine, sitting up on the hill, going CLANK-A-CHUGGA in the moonlight.","He reckoned the professor was half-right. You couldn't gobble up sadness and throw it away. Sadness was like Finchback Creek after a storm — it rose and it fell, and you couldn't make the water go by wishing.","But you could sit on the porch with someone while the water was high. You could bring them a furry thing that licked their face. You could tell a joke that wasn't very good, and watch them almost-smile.","And that, Tom figured, was about the best a machine could do. And about the best a person could do, too.","The Gobblestop Machine is still up on the hill, if you want to see it. It goes CLANK-A-CHUGGA sometimes, when the wind's right. The professor says he's working on a new model. This one turns loneliness into warm socks.","We'll see about that. But I wouldn't bet against him."]},{"id":"2026-07-26-en-6plus","date":"2026年7月26日 · 星期日","dateShort":"07/26","title":"The River Pirate of Tibbet's Bend (6+ yr)","language":"en","ageGroup":"6+","ageLabel":"6+ yr","preview":"Well now, if you were to ask me who was the most unlikely pirate ever to float a boat down the Old Muddy, I'd have to tell you about a girl named Clementine Finch. She was twelve years old, she had more freckles than sense, and she stole things that nobody in their right mind would want to steal...","moral":"The things we're ashamed of aren't always the things we should be. Sometimes what looks like stealing is just a person trying to hold onto something they're afraid of losing. And sometimes, the bravest thing you can do is put it back — and trust that the world won't forget you just because you stopped holding on.","content":["Well now, if you were to ask me who was the most unlikely pirate ever to float a boat down the Old Muddy, I'd have to tell you about a girl named Clementine Finch.","She was twelve years old. She had more freckles than sense, which her mother said was a dangerous combination. She had hair the color of a copper kettle left too long on the stove, and she had a way of looking at you that made you feel like she'd already figured out your secrets and was being polite about it.","She stole things.","Not the kind of things you'd expect a pirate to steal. She didn't want gold, or jewels, or fancy silver spoons with the mayor's initials on them, though Lord knows the mayor had enough of those.","No. Clementine Finch stole stories.","She'd drift her little flatboat — the Rattletrap, she called it, because it did — up to the docks at Tibbet's Bend, and she'd wait. She'd wait until some traveling salesman or river preacher or schoolteacher fresh off the steamboat sat down on a bench to rest, and then she'd sidle up, polite as you please, and she'd say:","'That's a fine hat, mister. I'll bet there's a story behind that hat.'","And nine times out of ten, there was. And the person would tell it. And Clementine would listen with those freckled eyes that saw right through you, and she'd nod, and she'd say 'Mmm-hmm' at all the right places, and when the story was done, she'd say:","'That's a real good one. Mind if I keep it?'","And the thing of it was — they always said yes. Because who minds giving away a story? It's not like a gold watch. You can tell a story and still have it yourself.","But that's where they were wrong. Because when Clementine took a story, she didn't just remember it. She took it. The way you'd take a stone from a creek bed. The person who told it would walk away feeling like something was missing, like a word was on the tip of their tongue but they couldn't quite — ","They couldn't remember their own story.","Clementine had a trunk on the Rattletrap, old and iron-bound, with a lock that had no key. And she'd put the stories in there, or that's how it seemed, because the trunk got heavier and heavier, and the people of Tibbet's Bend got quieter and quieter.","Old Captain Willits forgot the story of the big catfish he'd caught off the dock in '49. Mrs. Granger forgot the story of the winter the river froze solid and folks ice-skated from Tibbet's to Carthage. The schoolteacher forgot the story of the one-room schoolhouse and the blizzard and the fourteen children and the one stove.","A town that forgets its stories is a town that's forgetting itself. And a town that's forgetting itself starts to look like a photograph left in the sun — the edges go first, then the faces, then the whole thing fades to nothing.","It was young Tom — yes, the same Tom who'd later become entangled with a certain professor and his rubber chickens, but that's a different Tuesday — who figured it out. Tom was nine years old and had the kind of curiosity that gets children into trouble and out of it in equal measure.","He'd been watching Clementine. He'd noticed that the folks who talked to her seemed lighter afterward, but not in a good way. Lighter like a purse that's been picked. Lighter like a house where the furniture's been moved out.","Tom went down to the docks at dusk, when the steamboat had gone and the lamplighter was making his rounds. Clementine was sitting on the Rattletrap, her feet dangling in the water, her copper hair catching the last of the light.","'You're the river pirate,' Tom said.","Clementine looked at him. She didn't deny it. She had too much pride for that, and not quite enough sense to lie to a nine-year-old.","'I am,' she said.","'Why do you do it?'","Clementine was quiet for a long time. The river went shush-shush against the hull. A bullfrog said rummm-rummm from the reeds, like he was clearing his throat to speak.","'Because stories are the only things that last,' she said finally. 'Boats rot. Houses burn. People — ' she stopped. 'People leave. But stories, if you hold onto them tight enough, they stay. They're the only thing I've ever been able to keep.'","Tom, being nine, was not equipped to handle this level of sadness. But he was equipped to be honest, which is sometimes better.","'But they're not YOUR stories,' he said. 'And the town's forgetting itself. Captain Willits can't remember his catfish. Mrs. Granger can't remember the ice. If you take all the stories, there won't be anything left of Tibbet's Bend except the name, and even that might go.'","Clementine's face did something complicated. It went hard, then soft, then something in between that looked like it hurt.","'I didn't think about that,' she said. And Tom believed her, because she said it the way a person says something when they've just realized it's true.","She stood up. She went to the trunk. She put her hand on the lock — and it opened. Not because she had a key, but because, Tom reckoned, the trunk had been waiting to be opened by the right person at the right time, and this was it.",
