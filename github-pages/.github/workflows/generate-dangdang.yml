name: Generate Dangdang Series

on:
  # Automatic: every Saturday 02:00 Beijing time (18:00 UTC Friday)
  schedule:
    - cron: '0 18 * * 5'
  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate dangdang episode
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/generate-dangdang.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit. Episode already up to date."
          else
            COMMIT_DATE=$(TZ='Asia/Shanghai' date '+%Y-%m-%d')
            git commit -m "Auto-generate dangdang series ${COMMIT_DATE}"
            git push
            echo "Changes pushed successfully."
          fi
