name: Generate Bedtime Stories

on:
  # Automatic: runs at 02:00 Beijing time (18:00 UTC previous day) every day
  schedule:
    - cron: '0 18 * * *'
  # Manual: triggered via Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate stories
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        working-directory: github-pages
        run: node scripts/generate-story.js

      - name: CI Validation
        run: node scripts/ci-validate.js

      - name: Sync root stories.json
        run: |
          cp github-pages/stories.json stories.json

      - name: Copy generated HTML files to root
        run: |
          cp github-pages/bedtime-story-*.html . 2>/dev/null || true
          cp github-pages/index.html . 2>/dev/null || true

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit. All stories already up to date."
          else
            COMMIT_DATE=$(TZ='Asia/Shanghai' date '+%Y-%m-%d')
            git commit -m "Auto-generate bedtime stories ${COMMIT_DATE}"
            git push
            echo "Changes pushed successfully."
          fi
