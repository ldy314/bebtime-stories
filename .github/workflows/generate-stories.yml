name: Generate Bedtime Stories

on:
  # Automatic: runs at 02:00 Beijing time (18:00 UTC previous day) every day
  schedule:
    - cron: '0 18 * * *'
  # Manual: triggered by phone tap (workflow_dispatch)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate stories
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: node scripts/generate-story.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit. All stories already up to date."
          else
            COMMIT_DATE=$(TZ='Asia/Shanghai' date '+%Y-%m-%d')
            git commit -m "Auto-generate bedtime stories ${COMMIT_DATE}"
            git push
            echo "Changes pushed successfully."
          fi
